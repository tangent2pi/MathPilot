# 目标服务拓扑（实施规划 §4 组合根）——全部 10 服务已在 compose.yaml 启用。
# 各服务当前成熟度：
#   api             OIDC 验签 + JIT 映射 + 角色门（AUTH_DEV_FALLBACK 控制 dev 直通）
#   learning        教学闭环骨架（fake.grader 判答 → SER/TSS/SLR → Dream 入队）
#   profile         Dream 消费 + 确定性 Validator + 快照物化（supersede 链）
#   review          复核任务 CRUD + 纠正 supersede + BKT 重放 + 修订 SLR 入队
#   content         文档登记 → fake KTQ/ER 双 run → 复核门 → 发布 + 字段血缘
#   provider-broker fake ModelProvider（同构 trace）；真实密钥仅入本服务 secret store
#   artifact        manifest 校验硬规则（路径逃逸/required=false）；HTML 清洗待 WP-07
#   agent-runtime   Pi SDK/RPC 编排占位（真实 Session 隔离在此落地后，KTQ/ER 隔离测试生效）
#   sandbox-runner  spec 校验占位；真实 rootless 隔离落地前拒绝执行命令
#   web-test        nginx 同源反代 /api/；三页（学生/报告/教师）
# 约束：
# - 所有服务环境变量注入 OIDC issuer、PG DSN（最小权限账号）、Minio endpoint、OTEL endpoint；
# - 密钥只进 provider-broker 的 secret store；其他服务只拿 broker 句柄；
# - fake Provider 也必须产生同构 ProviderTrace（implementation 以 "fake." 前缀）。
