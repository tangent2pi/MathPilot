name: ${COMPOSE_PROJECT_NAME:-mathpilot}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PGPORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Temporal is the sole authority for retry, timer, cancellation, child wait,
  # Schedule and Continue-As-New in the Next learning runtime.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address \"$$(hostname -i):7233\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Exact browser origin(s) are supplied by deployment configuration.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mathpilot-app-dev-only}
    volumes:
      - ../../db/migrations:/migrations:ro
      - ../../db/migrate.sh:/migrate.sh:ro
      - ./app-role.sql:/app-role.sql:ro
    command:
      - sh
      - -ceu
      - |
        psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -v app_password="$${APP_DB_PASSWORD}" -f /app-role.sql
        sh /migrate.sh
    restart: "no"

  db-seed:
    image: postgres:16-alpine
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./bootstrap.sql:/seed.sql:ro
    environment:
      AGENT_DB_MASTER_SECRET: ${AGENT_DB_MASTER_SECRET:-mathpilot-agent-dev-master-change-me}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mathpilot-app-dev-only}
    command:
      - sh
      - -ce
      - |
        content_password=$$(printf '%s' "$${AGENT_DB_MASTER_SECRET}:mathpilot_agent_content_tnt_dev00001" | sha256sum | cut -d' ' -f1)
        student01_password=$$(printf '%s' "$${AGENT_DB_MASTER_SECRET}:mathpilot_agent_tnt_dev00001_usr_student01" | sha256sum | cut -d' ' -f1)
        student02_password=$$(printf '%s' "$${AGENT_DB_MASTER_SECRET}:mathpilot_agent_tnt_dev00001_usr_student02" | sha256sum | cut -d' ' -f1)
        student03_password=$$(printf '%s' "$${AGENT_DB_MASTER_SECRET}:mathpilot_agent_tnt_dev00001_usr_student03" | sha256sum | cut -d' ' -f1)
        psql "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 -q \
          -v app_password="$${APP_DB_PASSWORD}" \
          -v content_password="$$content_password" -v student01_password="$$student01_password" \
          -v student02_password="$$student02_password" -v student03_password="$$student03_password" \
          -f /seed.sql
    restart: "no"

  # The only initial library is the reviewed 174-row home extraction manifest.
  # This job is idempotent and never reads legacy content tables.
  official-content-import:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: content-next }
    environment:
      DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/${POSTGRES_DB:-mathpilot}
      DEFAULT_TENANT_ID: ${DEV_TENANT_ID:-tnt_dev00001}
      DEFAULT_TEACHER_USER_ID: ${DEFAULT_TEACHER_USER_ID:-usr_teacher01}
      MATHPILOT_REPO_ROOT: /app
    command: ["corepack", "pnpm", "--filter", "@mathpilot/content-next", "run", "migrate:official", "--", "--execute", "--report=/tmp/official-content-import-report.json"]
    depends_on:
      db-seed:
        condition: service_completed_successfully
    restart: "no"

  # The content candidate Pi host keeps its own minimal transcript database.
  # Browser learning conversations never use this database.
  pi-db-migrate:
    image: postgres:16-alpine
    depends_on:
      official-content-import:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../src/apps/web-next/db:/pi-migrations:ro
    command:
      - sh
      - -ceu
      - |
        exists=$$(psql -h postgres -U "$${POSTGRES_USER}" -d postgres -Atc "select 1 from pg_database where datname='mathpilot_pi'")
        if [ "$$exists" != "1" ]; then
          createdb -h postgres -U "$${POSTGRES_USER}" mathpilot_pi
        fi
        PI_DATABASE_URL="postgres://$${POSTGRES_USER}:$${PGPASSWORD}@postgres:5432/mathpilot_pi" sh /pi-migrations/migrate.sh
        psql -h postgres -U "$${POSTGRES_USER}" -d postgres -v ON_ERROR_STOP=1 -c "grant connect on database mathpilot_pi to mathpilot_app"
        psql -h postgres -U "$${POSTGRES_USER}" -d mathpilot_pi -v ON_ERROR_STOP=1 -c "grant usage on schema public to mathpilot_app; grant select,insert,update,delete on all tables in schema public to mathpilot_app; grant usage,select,update on all sequences in schema public to mathpilot_app; alter default privileges in schema public grant select,insert,update,delete on tables to mathpilot_app; alter default privileges in schema public grant usage,select,update on sequences to mathpilot_app"
    restart: "no"

  # 仅供确定性回归/演示使用。默认 `docker compose up` 不执行这批合成题；
  # 显式 `docker compose --profile fixtures run --rm db-fixtures` 才会加载。
  db-fixtures:
    profiles: ["fixtures"]
    image: postgres:16-alpine
    depends_on:
      db-seed:
        condition: service_completed_successfully
    volumes:
      - ./seed.sql:/fixtures.sql:ro
    command:
      - sh
      - -ce
      - psql "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB}" -v ON_ERROR_STOP=1 -q -f /fixtures.sql
    restart: "no"

  learning-next:
    init: true
    build:
      context: ../..
      dockerfile: src/services/learning-next/Dockerfile
    environment:
      DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/${POSTGRES_DB:-mathpilot}
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: mathpilot_learning_next
      LEARNING_NEXT_TENANT_IDS: ${DEV_TENANT_ID:-tnt_dev00001}
      LEARNING_NEXT_RUNTIME_ROOT: /var/lib/mathpilot/learning-next
      MODEL_API_BASE: ${PI_MODEL_API_BASE:-${MODEL_API_BASE:?MODEL_API_BASE is required}}
      MODEL_API_KEY: ${PI_MODEL_API_KEY:-${MODEL_API_KEY:?MODEL_API_KEY is required}}
      MODEL_ID_MAIN: ${PI_MODEL_ID_MAIN:-${MODEL_ID_MAIN:?MODEL_ID_MAIN is required}}
      MODEL_ID_AUX: ${PI_MODEL_ID_AUX:-${MODEL_ID_AUX:?MODEL_ID_AUX is required}}
      STORAGE_NEXT_URL: http://storage-next:3017
      STORAGE_NEXT_SECRET: ${STORAGE_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
    volumes:
      - learning_next_runtime:/var/lib/mathpilot/learning-next
    depends_on:
      official-content-import:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      storage-next:
        condition: service_started
    restart: unless-stopped

  # 内容候选后台 Agent 宿主；浏览器学习对话只走 learning-next/Temporal。
  pi-chat-runtime:
    init: true
    build:
      context: ../..
      dockerfile: src/services/pi-chat-runtime/Dockerfile
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, SETFCAP]
    environment:
      PI_DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/mathpilot_pi
      PI_GATEWAY_SECRET: ${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}
      PI_CHAT_RUNTIME_ROOT: /var/lib/mathpilot/pi-chat
      PI_CHAT_WORKSPACE_ROOT: /var/lib/mathpilot/pi-chat/sessions
      MODEL_API_BASE: ${PI_MODEL_API_BASE:-${MODEL_API_BASE:?MODEL_API_BASE is required}}
      MODEL_API_KEY: ${PI_MODEL_API_KEY:-${MODEL_API_KEY:?MODEL_API_KEY is required}}
      MODEL_ID_MAIN: ${PI_MODEL_ID_MAIN:-${MODEL_ID_MAIN:?MODEL_ID_MAIN is required}}
      MODEL_ID_AUX: ${PI_MODEL_ID_AUX:-${MODEL_ID_AUX:?MODEL_ID_AUX is required}}
      CONTENT_LIBRARY_URL: http://content-next:3016
      CONTENT_NEXT_URL: http://content-next:3016
      CONTENT_NEXT_SECRET: ${CONTENT_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      STORAGE_NEXT_URL: http://storage-next:3017
      STORAGE_NEXT_SECRET: ${STORAGE_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      # Core 只读当前线程；Search 仅得搜索凭据；OCR 仅得 OCR 凭据。
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      QWEN_MM_SEARCH_BACKEND: ${QWEN_MM_SEARCH_BACKEND:-auto}
      PADDLEOCR_MCP_MODEL: ${OCR_MODEL:-PaddleOCR-VL-1.6}
      PADDLEOCR_MCP_PPOCR_SOURCE: aistudio
      PADDLEOCR_MCP_AISTUDIO_ACCESS_TOKEN: ${OCR_API_TOKEN:-}
      PADDLEOCR_MCP_AISTUDIO_BASE_URL: ${OCR_API_BASE:-https://paddleocr.aistudio-app.com}
      PADDLEOCR_MCP_AISTUDIO_REQUEST_TIMEOUT: "120"
      PADDLEOCR_MCP_AISTUDIO_POLL_TIMEOUT: "600"
      PORT: "3105"
    volumes:
      - pi_chat_runtime:/var/lib/mathpilot/pi-chat
    depends_on:
      pi-db-migrate:
        condition: service_completed_successfully
      content-next:
        condition: service_started
      storage-next:
        condition: service_started

  # Next content boundary. It owns normalized candidates, reviews, packages,
  # review-feedback delivery and the ER handoff poller.
  content-next:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: content-next }
    environment:
      DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/${POSTGRES_DB:-mathpilot}
      PI_CHAT_RUNTIME_URL: http://pi-chat-runtime:3105
      PI_GATEWAY_SECRET: ${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}
      CONTENT_NEXT_SECRET: ${CONTENT_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      PORT: "3016"
    depends_on:
      official-content-import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CONTENT_NEXT_PORT:-3016}:3016"

  # MinIO management credentials are confined to this service. It returns
  # short-lived presigned URLs; no URL is persisted in PostgreSQL.
  storage-next:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: storage-next }
    environment:
      DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/${POSTGRES_DB:-mathpilot}
      STORAGE_NEXT_SECRET: ${STORAGE_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      PI_GATEWAY_SECRET: ${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PORT: "3017"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:${STORAGE_NEXT_PORT:-3017}:3017"

  web:
    build:
      context: ../..
      dockerfile: src/apps/web-next/Dockerfile
    environment:
      # Keep the browser CSP in sync with the exact endpoint used for signed URLs.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      - api
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"

  api:
    build:
      context: ../..
      dockerfile: src/services/api-next/Dockerfile
    environment:
      DATABASE_URL: postgres://mathpilot_app:${APP_DB_PASSWORD:-mathpilot-app-dev-only}@postgres:5432/${POSTGRES_DB:-mathpilot}
      CONTENT_NEXT_URL: http://content-next:3016
      CONTENT_NEXT_SECRET: ${CONTENT_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      STORAGE_NEXT_URL: http://storage-next:3017
      STORAGE_NEXT_SECRET: ${STORAGE_NEXT_SECRET:-${PI_GATEWAY_SECRET:-${AGENT_DB_MASTER_SECRET}}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-mathpilot-dev-secret-change-me-at-least-32-characters}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      BETTER_AUTH_SECURE_COOKIES: ${BETTER_AUTH_SECURE_COOKIES:-false}
      BETTER_AUTH_IP_ADDRESS_HEADERS: ${BETTER_AUTH_IP_ADDRESS_HEADERS:-x-real-ip}
      BETTER_AUTH_STUDENT_EMAIL: ${BETTER_AUTH_STUDENT_EMAIL:-student@mathpilot.local}
      BETTER_AUTH_STUDENT_PASSWORD: ${BETTER_AUTH_STUDENT_PASSWORD:-MathPilotStudent123!}
      BETTER_AUTH_TEACHER_EMAIL: ${BETTER_AUTH_TEACHER_EMAIL:-teacher@mathpilot.local}
      BETTER_AUTH_TEACHER_PASSWORD: ${BETTER_AUTH_TEACHER_PASSWORD:-MathPilotTeacher123!}
      PORT: "3101"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      content-next:
        condition: service_started
      storage-next:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-3101}:3101"

volumes:
  pgdata:
    # The default Next stack never opens or mutates the legacy PostgreSQL volume.
    name: ${POSTGRES_VOLUME:-mathpilot_pgdata_next}
  pi_chat_runtime:
    name: ${PI_CHAT_RUNTIME_VOLUME:-mathpilot_pi_chat_runtime}
  minio_data:
    name: ${MINIO_VOLUME:-mathpilot_minio_data}
  learning_next_runtime:
