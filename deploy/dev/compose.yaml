name: agmath-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../../db/migrations:/migrations:ro
      - ../../db/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    restart: "no"

  db-seed:
    image: postgres:16-alpine
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./seed.sql:/seed.sql:ro
    command:
      - sh
      - -ce
      - psql "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB}" -v ON_ERROR_STOP=1 -q -f /seed.sql
    restart: "no"

  learning:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: learning }
    environment:
      DATABASE_URL: postgres://agmath_app:agmath-app-dev-only@postgres:5432/agmath
      BROKER_URL: http://provider-broker:3004
      PORT: "3002"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      provider-broker:
        condition: service_started
    ports:
      - "3002:3002"

  profile:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: profile }
    environment:
      DATABASE_URL: postgres://agmath_app:agmath-app-dev-only@postgres:5432/agmath
      PORT: "3003"
    depends_on:
      db-seed:
        condition: service_completed_successfully
    ports:
      - "3003:3003"

  provider-broker:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: provider-broker }
    ports:
      - "3004:3004"

  agent-runtime:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: agent-runtime }

  content:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: content }
    environment:
      DATABASE_URL: postgres://agmath_app:agmath-app-dev-only@postgres:5432/agmath
      REVIEW_URL: http://review:3008
      PORT: "3006"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      review:
        condition: service_started

  artifact:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: artifact }

  review:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: review }
    environment:
      DATABASE_URL: postgres://agmath_app:agmath-app-dev-only@postgres:5432/agmath
    depends_on:
      db-seed:
        condition: service_completed_successfully

  sandbox-runner:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: sandbox-runner }

  web-test:
    build:
      context: ../..
      dockerfile: src/apps/web-test/Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"

  api:
    build:
      context: ../..
      dockerfile: src/services/Dockerfile
      args: { SERVICE_NAME: api }
    environment:
      LEARNING_URL: http://learning:3002
      PROFILE_URL: http://profile:3003
      CONTENT_URL: http://content:3006
      REVIEW_URL: http://review:3008
      DATABASE_URL: postgres://agmath_app:agmath-app-dev-only@postgres:5432/agmath
      OIDC_ISSUER: http://localhost:8080/realms/agmath
      OIDC_JWKS_URL: http://keycloak:8080/realms/agmath/protocol/openid-connect/certs
      AUTH_DEV_FALLBACK: "true"   # 生产必须 false：无 token 即 401
      PORT: "3001"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      learning:
        condition: service_started
      profile:
        condition: service_started
      provider-broker:
        condition: service_started
      review:
        condition: service_started
      content:
        condition: service_started
    ports:
      - "3001:3001"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-agmath.json:/opt/keycloak/data/import/realm-agmath.json:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    healthcheck:
      # KC 25+ 的 /health 在 9000 管理端口且需显式开启；改为探测 realm well-known，
      # 同时证明 realm 导入成功
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/agmath/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 18

  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT}:4317"

volumes:
  pgdata:
  miniodata:
