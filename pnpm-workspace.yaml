packages:
  - "src/packages/*"
  - "src/packages/providers/*"
  - "src/services/*"
  - "src/apps/*"
allowBuilds:
  # tsx requires esbuild's platform-binary verification/install script.
  esbuild: true
  # No runtime path in MathPilot needs this optional package's install script.
  '@google/genai': false
  # Temporal's workflow bundler uses SWC's pinned native binding.
  '@swc/core': true
  protobufjs: set this to true or false
minimumReleaseAgeExclude:
  - pi-mcp-adapter@2.26.1
  - '@ai-sdk/gateway@4.0.68'
  - '@ai-sdk/openai-compatible@3.0.40'
  - '@ai-sdk/provider-utils@5.0.33'
  - ai@7.0.84
patchedDependencies:
  '@assistant-ui/react-pi@0.0.20': patches/@assistant-ui__react-pi@0.0.20.patch
# 源码直挂部署下，容器内 pnpm run 前不做依赖自检重装（镜像已含完整依赖；
# 依赖变更走显式 rebuild）。
verifyDepsBeforeRun: false
