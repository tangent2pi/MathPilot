limit_req_zone $binary_remote_addr zone=mathpilot_api_flood:10m rate=${MATHPILOT_API_RATE};

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  etag on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: ${MINIO_PUBLIC_ENDPOINT}; media-src 'self' data: blob:; frame-src 'self'; connect-src 'self' ${MINIO_PUBLIC_ENDPOINT}" always;
  add_header Retry-After $mathpilot_retry_after always;
  add_header Cache-Control $mathpilot_problem_cache_control always;

  set $mathpilot_retry_after "";
  set $mathpilot_problem_cache_control "";

  error_page 413 = @mathpilot_request_too_large;
  error_page 429 = @mathpilot_rate_limited;
  error_page 502 = @mathpilot_bad_gateway;
  error_page 503 = @mathpilot_service_unavailable;
  error_page 504 = @mathpilot_gateway_timeout;

  location /api/ {
    client_max_body_size 32m;
    limit_req zone=mathpilot_api_flood burst=${MATHPILOT_API_BURST} nodelay;
    limit_req_status 429;
    proxy_pass http://api:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_read_timeout 420s;
  }

  location @mathpilot_request_too_large {
    set $mathpilot_problem_cache_control "no-store";
    default_type application/problem+json;
    return 413 '{"type":"urn:mathpilot:problem:request-body-too-large","title":"Request body is too large","status":413,"code":"request_body_too_large"}';
  }

  location @mathpilot_rate_limited {
    set $mathpilot_retry_after "1";
    set $mathpilot_problem_cache_control "no-store";
    default_type application/problem+json;
    return 429 '{"type":"urn:mathpilot:problem:request-rate-exceeded","title":"Request rate exceeded","status":429,"code":"request_rate_exceeded"}';
  }

  location @mathpilot_bad_gateway {
    set $mathpilot_problem_cache_control "no-store";
    default_type application/problem+json;
    return 502 '{"type":"urn:mathpilot:problem:gateway-unavailable","title":"Gateway unavailable","status":502,"code":"gateway_unavailable"}';
  }

  location @mathpilot_service_unavailable {
    set $mathpilot_problem_cache_control "no-store";
    default_type application/problem+json;
    return 503 '{"type":"urn:mathpilot:problem:service-unavailable","title":"Service unavailable","status":503,"code":"service_unavailable"}';
  }

  location @mathpilot_gateway_timeout {
    set $mathpilot_problem_cache_control "no-store";
    default_type application/problem+json;
    return 504 '{"type":"urn:mathpilot:problem:gateway-timeout","title":"Gateway timeout","status":504,"code":"gateway_timeout"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
