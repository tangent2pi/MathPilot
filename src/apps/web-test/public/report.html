<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报告与计划 · AGMATH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">AGMATH<small>WEB-TEST · 流程验证</small></a>
    <nav>
      <a href="/">每日练习</a>
      <a href="/report.html" aria-current="page">报告与计划</a>
      <a href="/teacher.html">教师复核</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">画像快照</h1>
    <p class="page-sub">长期画像只由 Dream 整理发布。程序基准是科学锚点，最终画像由画像模型综合证据决定。</p>

    <form id="q" style="max-width:420px;display:flex;gap:.6rem;align-items:end">
      <div style="flex:1">
        <label for="student">学生 ID</label>
        <input id="student" value="usr_student01" autocomplete="off" />
      </div>
      <button class="btn" type="submit">查看快照</button>
    </form>

    <div style="margin:1.2rem 0">
      <button class="btn ghost" id="dreamBtn" type="button">立即整理（Dream）</button>
      <span class="mono" id="dreamOut" style="margin-left:.8rem;color:var(--ink-faint)"></span>
    </div>

    <hr class="rule" />
    <div id="result"></div>
  </main>

  <script>
    const API = ""; // 同源：nginx 将 /api/ 反代至 api 服务
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const result = document.getElementById("result");
    const studentInput = document.getElementById("student");
    const ZH = { insufficient_evidence: "证据不足", weak: "薄弱", learning: "学习中", possibly_mastered: "可能掌握", mastered: "已掌握" };
    const STATES = new Set(Object.keys(ZH));

    async function loadSnapshot() {
      const sid = studentInput.value.trim();
      const res = await fetch(`${API}/api/snapshots/${encodeURIComponent(sid)}`);
      if (res.status === 404) {
        result.innerHTML = `<div class="empty">还没有画像快照。到<a href="/">每日练习</a>完成几道题，再点“立即整理”。</div>`;
        return;
      }
      const d = await res.json();
      const cards = (d.dimensions ?? []).map((dim) => `
        <div class="archive-card">
          <div class="dim">${esc(dim.dimension_id)}</div>
          <div class="big-number">${esc(dim.p_profile)}<small> P(画像)</small></div>
          <br><span class="state-tag ${STATES.has(dim.state) ? dim.state : ""}">${esc(ZH[dim.state] ?? dim.state)}</span>
          <div class="delta-row">
            <span class="mono" style="color:var(--ink-faint)">程序基准 ${esc(dim.p_bkt_baseline ?? "—")}</span>
            <span class="mono" style="color:var(--ink-faint)">观测 ${esc(dim.independent_observation_count ?? 0)}</span>
          </div>
        </div>`).join("");
      result.innerHTML = `
        <p class="mono" style="color:var(--ink-faint);font-size:.75rem">
          snapshot ${esc(d.snapshot_id)} · 来源决策 ${esc(d.source_decision_id)}${d.supersedes ? ` · 取代 ${esc(d.supersedes)}` : ""}
        </p>
        <div class="archive-grid">${cards}</div>`;
    }

    document.getElementById("q").onsubmit = (e) => { e.preventDefault(); loadSnapshot(); };
    document.getElementById("dreamBtn").onclick = async () => {
      const out = document.getElementById("dreamOut");
      out.textContent = "整理中…";
      const res = await fetch(`${API}/api/dream/run`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ student_id: studentInput.value.trim() }),
      });
      const d = await res.json();
      if (d.status === "no_pending_records") { out.textContent = "没有待整理的双产物。"; return; }
      out.textContent = `已发布快照 ${d.snapshot_id}（消费 ${d.consumed_records} 条记录，校验 ${d.validation?.result}）`;
      loadSnapshot();
    };

    loadSnapshot();
  </script>
</body>
</html>
