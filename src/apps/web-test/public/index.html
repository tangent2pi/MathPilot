<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日练习 · AGMATH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <svg width="0" height="0" aria-hidden="true">
    <filter id="ink-rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" />
    </filter>
  </svg>

  <header class="masthead">
    <a class="brand" href="/">AGMATH<small>WEB-TEST · 流程验证</small></a>
    <nav>
      <a href="/" aria-current="page">每日练习</a>
      <a href="/report.html">报告与计划</a>
      <a href="/teacher.html">教师复核</a>
      <a href="/content.html">内容管线</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">解三角形 · 单题诊断</h1>
    <p class="page-sub">一题一会话。作答后系统给出判定、程序基准与教学总结，证据进入画像队列。</p>

    <!-- 状态章：真实 Session 状态机（骨架链） -->
    <div class="state-seals" id="seals" aria-label="Session 状态">
      <div class="seal-wrap"><div class="seal" data-state="CREATE">创建</div></div>
      <div class="seal-wrap"><div class="seal" data-state="SUBMIT">提交</div></div>
      <div class="seal-wrap"><div class="seal" data-state="GRADE">判答</div></div>
      <div class="seal-wrap"><div class="seal" data-state="SCIENTIFIC_EVALUATE">程序<br>评价</div></div>
      <div class="seal-wrap"><div class="seal" data-state="TEACHING_SESSION_SUMMARY">教学<br>总结</div></div>
      <div class="seal-wrap"><div class="seal" data-state="QUEUE_DREAM">画像<br>队列</div></div>
    </div>

    <div class="dossier">
      <section class="question-card graph-paper" aria-label="题目">
        <div class="corner-seal">试点</div>
        <div class="qid" id="qidLabel">Q_TRI_012 · 诊断模式</div>
        <h2>在△ABC中，已知 a=√3，b=2，A=30°。求角 B。<br><span style="font-size:.85rem;color:var(--ink-soft)">（提示：注意 SSA 情形的解的个数。）</span></h2>

        <form id="createForm">
          <label for="student">学生</label>
          <input id="student" value="usr_student01" autocomplete="off" />
          <label for="mode">模式</label>
          <select id="mode">
            <option value="diagnostic">诊断（独立作答计入画像证据）</option>
            <option value="help">求助（提示后不计独立证据）</option>
            <option value="review">复盘</option>
          </select>
          <button class="btn" id="createBtn" type="submit">开始本题</button>
        </form>

        <form id="answerForm" hidden>
          <label for="answer">你的解答</label>
          <textarea id="answer" rows="4">由正弦定理 a/sin A = b/sin B，得 sin B = b·sin A / a = 2×0.5/√3 = 1/√3 ≈ 0.5774，故 B ≈ 35.3° 或 144.7°，均满足 A+B&lt;180°，两解都成立。</textarea>
          <button class="btn" type="submit">提交答案</button>
        </form>
      </section>

      <section class="evidence-flow" id="flow" aria-live="polite">
        <div class="empty" id="emptyHint">卷宗待启。开始本题后，判定、程序基准与教学证据会钉在这里。</div>
      </section>
    </div>
  </main>

  <script>
    const API = ""; // 同源：nginx 将 /api/ 反代至 api 服务
    // 动态文本一律转义（教学总结会回显学生作答，视为不可信数据）
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const flow = document.getElementById("flow");
    const seals = [...document.querySelectorAll(".seal")];
    let sessionId = null;

    function stampUpTo(state) {
      const order = ["CREATE", "SUBMIT", "GRADE", "SCIENTIFIC_EVALUATE", "TEACHING_SESSION_SUMMARY", "QUEUE_DREAM"];
      const idx = order.indexOf(state);
      seals.forEach((el, i) => {
        if (i <= idx) setTimeout(() => el.classList.add("done"), i * 260);
      });
    }

    function record(k, vHtml) {
      const div = document.createElement("div");
      div.className = "record";
      div.innerHTML = `<div class="k">${k}</div><div class="v">${vHtml}</div>`;
      flow.appendChild(div);
      return div;
    }

    document.getElementById("createForm").onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch(`${API}/api/sessions`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          student_id: document.getElementById("student").value,
          question_id: "Q_TRI_012",
          chapter_package_version: "0.1.0",
          mode: document.getElementById("mode").value,
          draft_enabled: false,
        }),
      });
      const data = await res.json();
      sessionId = data.session_id;
      document.getElementById("answerForm").hidden = false;
      document.getElementById("createBtn").disabled = true;
      document.getElementById("emptyHint").remove();
      stampUpTo("CREATE");
      record("SESSION", `<span class="mono">${esc(data.session_id)}</span> · ${esc(data.mode)} · ${data.counts_toward_independent_evidence ? "计入独立证据" : "不计独立证据"}`);
    };

    document.getElementById("answerForm").onsubmit = async (e) => {
      e.preventDefault();
      stampUpTo("SUBMIT");
      const submitBtn = document.querySelector("#answerForm button");
      submitBtn.disabled = true;
      const pendingEl = record("判答中 · GRADE",
        `<span class="pending"><span class="spinner"></span> Teaching Agent 判读中（推理模型，可能需要 30–90 秒）…</span>`);

      let res, data;
      try {
        res = await fetch(`${API}/api/sessions/${sessionId}/submit`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ answer_text: document.getElementById("answer").value }),
        });
        data = await res.json();
      } catch {
        pendingEl.remove();
        submitBtn.disabled = false;
        record("判答失败", `<div class="error-card">请求失败：网络错误或服务不可达。请稍后重试。<span class="code">network_error</span></div>`);
        return;
      }
      pendingEl.remove();
      submitBtn.disabled = false;

      if (!res.ok) {
        const msgs = {
          502: "判答模型暂不可用（限流或超时）。系统不会伪造判定——请稍后重新开始本题。",
          409: "本题会话已关闭，无法重复提交。",
          404: "会话不存在，请重新开始本题。",
          422: "提交内容不合法（答案为空、过长或维度非法）。",
        };
        record("判答失败", `<div class="error-card">${msgs[res.status] ?? "判答被拒绝。"}<span class="code">${esc(data.error ?? res.status)}${data.detail ? " · " + esc(data.detail) : ""}</span></div>`);
        return;
      }
      stampUpTo("QUEUE_DREAM");

      const v = data.judgment?.verdict;
      const cls = v === "correct" ? "ok" : v === "partially_correct" ? "partial" : "bad";
      const zh = { correct: "正确", partially_correct: "部分正确", incorrect: "不正确", unresolved: "待复核" }[v] ?? v;
      const rubricZh = { met: "已达成", not_met: "未达成", unclear: "待澄清" };
      const rubric = (data.judgment?.rubric_items ?? []).map((r) =>
        `<li><span class="mark ${esc(r.status)}">${esc(rubricZh[r.status] ?? r.status)}</span><span>${esc(r.id)}</span></li>`).join("");
      record("判定 · ANSWER JUDGMENT",
        `<span class="verdict ${cls}">${esc(zh)}</span>` +
        (v === "unresolved" ? `<div class="notice" style="margin-top:.5rem">判定不确定，已进入教师复核队列；本题不计入掌握证据。</div>` : "") +
        `<div class="mono" style="margin-top:.4rem">${esc(data.judgment?.decision_summary ?? "")}</div>` +
        (rubric ? `<ul class="rubric-list">${rubric}</ul>` : ""));

      const ser = data.scientific_evaluation_report;
      record("程序基准 · SCIENTIFIC EVALUATION",
        `<span class="big-number">${esc(ser.p_bkt_baseline)}<small> P(掌握)</small></span><span class="prior-flag">${esc(ser.calibration_status)} · 未校准</span><br>` +
        `<span class="mono">独立观测 ${esc(ser.independent_observation_count)} 次 · 参数集 ${esc(ser.parameter_set_id)}</span>`);

      record("教学总结 · TEACHING SUMMARY", esc(data.teaching_session_summary?.summary ?? ""));

      record("画像队列",
        `<span class="mono">${esc(data.session_learning_record_id)}</span> 已封装双产物并入队。长期画像只在 Dream 整理后更新——到<a href="/report.html">报告与计划</a>查看。`);
    };
  </script>
</body>
</html>
