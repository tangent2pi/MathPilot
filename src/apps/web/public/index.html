<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日练习 · AGMATH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .home { max-width: 980px; margin: 0 auto; padding: 2.4rem 1.6rem 4rem; }
    .home-title { font-family: var(--serif); font-size: 1.7rem; margin: 0 0 .3rem; }
    .home-sub { color: var(--ink-soft); font-size: .95rem; margin: 0 0 2rem; }
    .entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .entry {
      border: 1px solid var(--ink); padding: 1.3rem 1.4rem; text-decoration: none;
      display: block; transition: box-shadow .15s, transform .15s; background: var(--paper);
    }
    .entry:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .entry .no { font-family: var(--mono); font-size: .68rem; color: var(--cinnabar); letter-spacing: .14em; }
    .entry h2 { font-family: var(--serif); font-size: 1.15rem; margin: .4rem 0 .3rem; }
    .entry p { font-size: .85rem; color: var(--ink-soft); margin: 0; line-height: 1.6; }
    .profile-card {
      border: 1px dashed var(--ink-soft); padding: 1rem 1.2rem; margin-bottom: 1.6rem;
      display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .profile-card .mono-line { font-family: var(--mono); font-size: .72rem; color: var(--ink-soft); }
  </style>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/"><span class="mark">◆</span>AGMATH<small>数学诊断卷宗</small></a>
    <nav>
      <a href="/" aria-current="page">每日练习</a>
      <a href="/report.html">报告与计划</a>
      <a href="/teacher.html">教师复核</a>
      <a href="/solve.html">单题诊断</a>
    </nav>
  </header>

  <main class="home">
    <h1 class="home-title">学习首页</h1>
    <p class="home-sub">少量题目完成有效诊断——每一次作答都会变成可追溯的证据。</p>

    <div class="profile-card" id="profileCard">
      <div class="mono-line" id="profileStatus">正在读取画像…</div>
      <a class="btn ghost" href="/profile.html">完善画像</a>
    </div>

    <div class="entries">
      <a class="entry" href="/solve.html">
        <div class="no">01</div><h2>每日练习</h2>
        <p>按计划与薄弱项自适应选题，聊天式一题一诊断。</p>
      </a>
      <a class="entry" href="/solve.html?mode=review">
        <div class="no">02</div><h2>错题重刷</h2>
        <p>按复测到期程度排序，验证保持率与提取能力。</p>
      </a>
      <a class="entry" href="/solve.html">
        <div class="no">03</div><h2>问问 AI</h2>
        <p>自带题目或自由提问。库外题不计入正式画像。</p>
      </a>
      <a class="entry" href="/report.html">
        <div class="no">04</div><h2>报告与计划</h2>
        <p>五档掌握状态、证据展开、薄弱排序与 1-4 周学习计划。</p>
      </a>
    </div>
  </main>

  <script>
    const API = "";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const card = document.getElementById("profileCard");
    const status = document.getElementById("profileStatus");

    (async () => {
      const res = await fetch(`${API}/api/students/usr_student01/profile`).catch(() => null);
      if (!res) { status.textContent = "服务不可达。"; return; }
      if (res.status === 404) {
        status.innerHTML = `尚未完成最小画像注册——<a href="/profile.html">立即注册</a>（画像只影响选题与计划，不直接判定掌握）。`;
        return;
      }
      const d = await res.json();
      status.innerHTML = `画像：${esc(d.grade)} · 当前 ${esc(d.current_score ?? "—")} 分 · 目标 ${esc(d.target_score ?? "—")} 分 · ` +
        `每周 ${esc(d.weekly_hours)} 小时 · 草稿方式：${esc(d.device_draft)}`;
    })();
  </script>
</body>
</html>
