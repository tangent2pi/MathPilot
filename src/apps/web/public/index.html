<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习 · AGMATH</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"></head>
<body data-page-title="学习">
  <header class="app-header" data-app-shell aria-label="应用顶栏"></header>
  <main class="page student-home">
    <section class="home-focus">
      <div class="home-intro"><p class="eyebrow">今天的学习</p><h1>从最值得继续的一步开始</h1><p id="welcomeLine">正在为你整理今天的任务…</p></div>
      <blockquote class="daily-note"><p>“真正的理解，会在你能解释每一步时出现。”</p><footer>今日学习提示</footer></blockquote>
    </section>

    <section class="next-task" id="nextTask">
      <div class="next-task-copy"><span class="next-task-label">下一步</span><h2 id="nextTitle">读取学习设置</h2><p id="nextDescription">稍候，我们正在确定最合适的开始方式。</p><div class="next-task-meta" id="nextMeta"></div></div>
      <button class="btn cinnabar" id="startPrimary" type="button" disabled>开始</button>
    </section>

    <div class="home-columns">
      <section class="section-card"><div class="section-heading"><div><p class="eyebrow">快捷开始</p><h2>你想做什么？</h2></div></div>
        <div class="quick-list">
          <button class="quick-action" id="entryReview" type="button" disabled><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M5.5 15a7.5 7.5 0 0 0 12.8 2.3L20 14M4 10l1.7-3.3A7.5 7.5 0 0 1 18.5 9"/></svg></span><span><strong>复习到期内容</strong><small>看看哪些知识需要再确认一次</small></span><span>→</span></button>
          <button class="quick-action" id="entryTraining" type="button" disabled><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m12 3 9 17H3Z"/><path d="M9.5 15.5h5M12 8v4"/></svg></span><span><strong>专项练习</strong><small>围绕一个薄弱点逐步巩固</small></span><span>→</span></button>
          <a class="quick-action" href="/solve.html"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.8 2c-1 .7-1.6 1.1-1.6 2.5M12 17.5h.01"/></svg></span><span><strong>问一道题</strong><small>上传题目或草稿，和智能老师讨论</small></span><span>→</span></a>
        </div>
      </section>

      <section class="section-card progress-card"><div class="section-heading"><div><p class="eyebrow">最近进度</p><h2>学习概览</h2></div><a href="/report.html">查看报告</a></div><div id="progress"><div class="empty-note">完成一次学习后，这里会显示最近变化</div></div></section>
    </div>
  </main>

  <script type="module">
    import { apiFetch, requirePrincipal } from "/assets/app-shell.js";
    const principal = await requirePrincipal(); const studentId = principal.user_id; const $ = (id) => document.getElementById(id); let profileReady = false;
    async function startRun(goal) {
      if (!profileReady) { location.href = "/profile.html?first=1"; return; }
      const buttons = [$("startPrimary"),$("entryReview"),$("entryTraining")], primaryLabel = $("startPrimary").textContent; buttons.forEach((button)=>button.disabled=true); $("startPrimary").textContent = "正在准备…";
      const response = await apiFetch("/api/assessment-runs", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ student_id:studentId, goal }) }); const data = await response.json();
      if (!response.ok) { $("nextDescription").textContent = data.error === "no_questions" ? "当前还没有可用练习，请稍后再来。" : "暂时无法开始，请稍后重试。"; $("startPrimary").textContent = primaryLabel; buttons.forEach((button)=>button.disabled=false); return; }
      const nextResponse = await apiFetch(`/api/assessment-runs/${data.run_id}/next`, { method:"POST" }); const next = await nextResponse.json();
      if (!nextResponse.ok || !next.question_id) { $("nextDescription").textContent = "当前没有合适的下一题。你可以先查看报告或问一道题。"; $("startPrimary").textContent = primaryLabel; buttons.forEach((button)=>button.disabled=false); return; }
      location.href = `/solve.html?run=${encodeURIComponent(data.run_id)}&goal=${encodeURIComponent(next.goal || goal)}&q=${encodeURIComponent(next.question_id)}`;
    }
    $("startPrimary").onclick = () => startRun("coverage"); $("entryReview").onclick = () => startRun("review"); $("entryTraining").onclick = () => startRun("training");
    const [profileResponse, projectionResponse] = await Promise.all([apiFetch(`/api/students/${encodeURIComponent(studentId)}/profile`).catch(()=>null), apiFetch(`/api/students/${encodeURIComponent(studentId)}/projection`).catch(()=>null)]);
    if (!profileResponse || profileResponse.status === 404) {
      $("welcomeLine").textContent = "先用两分钟告诉我们你的学习目标。"; $("nextTitle").textContent = "完成学习设置"; $("nextDescription").textContent = "设置年级、目标和每周时间，系统就能安排第一轮练习。"; $("startPrimary").textContent = "开始设置"; $("startPrimary").disabled = false;
    } else if (profileResponse.ok) {
      const profile = await profileResponse.json(); profileReady = true; $("welcomeLine").textContent = `目标 ${profile.target_score ?? "待设置"} 分 · 每周 ${profile.weekly_hours || "按你的节奏"}`; $("nextTitle").textContent = "开始一轮短练习"; $("nextDescription").textContent = "从当前学习证据中选择一道最有价值的题，完成后再决定是否继续。"; $("nextMeta").textContent = "通常 10–15 分钟"; $("startPrimary").textContent = "开始学习"; $("startPrimary").disabled = false; $("entryReview").disabled = false; $("entryTraining").disabled = false;
    } else { $("welcomeLine").textContent = "暂时无法读取学习设置。"; $("nextTitle").textContent = "稍后再试"; $("nextDescription").textContent = "服务恢复后可以继续上次的学习进度。"; }
    if (projectionResponse?.ok) {
      const data = await projectionResponse.json(), dims = data.snapshot?.dimensions || []; const host = $("progress"); host.replaceChildren();
      const counts = { mastered:0, learning:0, weak:0, review:0 }; for (const dim of dims) { if (dim.state === "mastered" || dim.state === "possibly_mastered") counts.mastered++; else if (dim.state === "weak") counts.weak++; else counts.learning++; }
      const grid = document.createElement("div"); grid.className = "progress-grid"; for (const [label,value] of [["较稳定",counts.mastered],["学习中",counts.learning],["需要关注",counts.weak]]) { const item=document.createElement("div");item.innerHTML=`<strong>${value}</strong><span>${label}</span>`;grid.append(item); } host.append(grid);
    }
  </script>
</body>
</html>
