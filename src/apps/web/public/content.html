<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容工坊 · AGMATH</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"></head>
<body class="proof-ui" data-page-title="内容工坊">
  <header class="app-header" data-app-shell aria-label="应用顶栏"></header>
  <main class="page content-studio">
    <section class="page-hero compact studio-hero">
      <p class="eyebrow">内容</p><h1>整理一批新的教学资料</h1>
      <p class="lede">添加讲义、题目或图片，检查清单后再开始处理。任务开始后，你可以随时回来查看进度和继续对话。</p>
    </section>
    <div class="studio-grid">
      <section class="section-card upload-sheet">
        <div class="section-heading"><div><p class="eyebrow">新资料</p><h2>添加文件</h2></div><span id="selectionSummary" class="paper-tag">0 个文件</span></div>
        <label id="dropzone" class="dropzone" for="materials" tabindex="0">
          <input id="materials" type="file" multiple>
          <span><strong>拖到这里，或点击选择文件</strong>可以分多次添加 PDF、图片、Office 文档、文本和常见数据文件。</span>
        </label>
        <div id="fileList" class="file-list"><div class="empty-note">添加本次要一起整理的资料</div></div>
        <label id="libraryChoice" class="field-stack" hidden><span>保存到</span><select id="libraryVisibility"><option value="public">公共内容库</option><option value="teacher">我的内容库</option></select><small>公共内容可供所有学生使用；我的内容仅供已绑定的学生使用。</small></label>
        <div class="action-cluster"><button id="start" class="btn cinnabar" type="button" disabled>上传并检查</button><button id="clear" class="btn ghost" type="button" disabled>清空选择</button></div>
        <p id="uploadFeedback" class="muted" aria-live="polite"></p>
      </section>
      <aside class="section-card pipeline-guide">
        <p class="eyebrow">处理步骤</p><h2>你始终知道下一步</h2>
        <ol class="atelier-steps"><li><strong>检查资料</strong><span>上传后先核对文件清单，再确认开始。</span></li><li><strong>整理内容</strong><span>系统提取题目、知识点、错因和诊断规则。</span></li><li><strong>复核发布</strong><span>检查来源、题图和答案后发布给学生使用。</span></li></ol>
      </aside>
    </div>
    <section class="section-card run-ledger">
      <div class="section-heading"><div><p class="eyebrow">内容任务</p><h2>最近处理</h2><p class="muted">待确认、处理中和需要复核的任务都会保留在这里。</p></div><button id="refresh" class="btn ghost" type="button">刷新</button></div>
      <div id="runs" class="run-list"><div class="empty-note">正在读取任务…</div></div>
    </section>
  </main>
  <script type="module">
    import { requirePrincipal, apiFetch } from "/assets/app-shell.js";
    const principal=await requirePrincipal(["teacher","content_reviewer"]);
    const $=id=>document.getElementById(id), selected=[];
    const key=f=>`${f.name}\0${f.size}\0${f.lastModified}`;
    const size=n=>n<1048576?`${Math.max(1,Math.ceil(n/1024))} KiB`:`${(n/1048576).toFixed(1)} MiB`;
    function add(files){const seen=new Set(selected.map(key)); for(const f of files)if(!seen.has(key(f))){selected.push(f);seen.add(key(f));} renderFiles();}
    function renderFiles(){
      $("fileList").replaceChildren();
      if(!selected.length)$("fileList").innerHTML='<div class="empty-note">添加本次要一起整理的资料</div>';
      selected.forEach((f,i)=>{const row=document.createElement("article");row.className="file-item";const copy=document.createElement("div");copy.innerHTML=`<strong></strong><small></small>`;copy.querySelector("strong").textContent=f.name;copy.querySelector("small").textContent=`${f.type||"待识别类型"} · ${size(f.size)}`;const remove=document.createElement("button");remove.className="text-button";remove.textContent="移除";remove.onclick=()=>{selected.splice(i,1);renderFiles();};row.append(copy,remove);$("fileList").append(row);});
      $("selectionSummary").textContent=`${selected.length} 个文件`; $("start").disabled=!selected.length||selected.some(f=>f.size>20*1048576)||selected.length>100; $("clear").disabled=!selected.length;
      $("uploadFeedback").textContent=selected.some(f=>f.size>20*1048576)?"请移除超过 20 MiB 的文件后继续。":"";
    }
    const canPublishPublic=(principal.roles||[]).includes("tenant_admin");if(canPublishPublic)$("libraryChoice").hidden=false;
    const input=$("materials"), zone=$("dropzone"); input.onchange=()=>{add(input.files);input.value="";};
    for(const type of ["dragenter","dragover"] )zone.addEventListener(type,e=>{e.preventDefault();zone.classList.add("is-dragging");});
    for(const type of ["dragleave","drop"] )zone.addEventListener(type,e=>{e.preventDefault();zone.classList.remove("is-dragging");});
    zone.addEventListener("drop",e=>add(e.dataTransfer.files));
    zone.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();input.click();}});
    $("clear").onclick=()=>{selected.splice(0);renderFiles();};
    const b64=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.readAsDataURL(file);});
    const uploadBody=async(file)=>({filename:file.name,mime_type:file.type||"application/octet-stream",kind:"teaching_material",file_base64:await b64(file)});
    async function appendFiles(runId,files,onProgress=()=>{}){for(let i=0;i<files.length;i++){onProgress(i+1,files.length);const response=await apiFetch(`/api/content/pipelines/${encodeURIComponent(runId)}/files`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({files:[await uploadBody(files[i])]})}),data=await response.json();if(!response.ok)throw new Error(data.detail||data.error||String(response.status));}}
    $("start").onclick=async()=>{const button=$("start"),pending=[...selected];button.disabled=true;button.textContent="正在上传…";$("uploadFeedback").textContent=`正在上传 1 / ${pending.length}…`;let runId="";
      try{const response=await apiFetch("/api/content/pipelines",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({files:[await uploadBody(pending[0])],library_visibility:canPublishPublic?$("libraryVisibility").value:"teacher"})}),data=await response.json();
        if(!response.ok)throw new Error(data.detail||data.error||String(response.status));runId=data.run_id;
        await appendFiles(runId,pending.slice(1),(current,total)=>{$("uploadFeedback").textContent=`正在上传 ${current+1} / ${total+1}…`;});
        selected.splice(0);renderFiles();$("uploadFeedback").textContent="文件已保存。请检查清单，然后确认开始处理。";await loadRuns(runId);
      }catch(error){$("uploadFeedback").textContent=runId?`部分文件已保存到待确认任务：${error.message}`:`提交失败：${error.message}`;if(runId){selected.splice(0);renderFiles();await loadRuns(runId);}}finally{button.textContent="上传并检查";renderFiles();}};
    const stageName={upload:"资料已保存",ktq:"整理题目与知识点",er:"补充错因与规则",review:"复核与发布"},statusName={draft:"待确认",queued:"准备中",running:"处理中",review_ready:"需要复核",published:"已发布",failed:"需要处理"};
    function sessionLink(ref,label){const a=document.createElement("a");a.className="btn ghost";a.href=`/agent-session.html?ref=${encodeURIComponent(ref)}`;a.textContent=label;return a;}
    async function reviewProgress(run){
      if(run.status!=="review_ready")return null;
      const params=new URLSearchParams({queue:"content",source_pipeline_id:run.run_id,limit:"1"});
      const response=await apiFetch(`/api/review/tasks?${params}`);if(!response.ok)return null;
      return response.json();
    }
    function publishPanel(run,review){
      const panel=document.createElement("section");panel.className="publish-panel";
      if(!review){panel.append(Object.assign(document.createElement("p"),{textContent:"正在读取本批复核进度…"}));return panel;}
      const total=Number(review.total_count||0),pending=Number(review.pending_count||0),rejected=Number(review.rejected_count||0),resolved=Number(review.resolved_count||0);
      const status=document.createElement("p");status.className=`status-note ${rejected?"warning":pending?"":"success"}`;
      status.textContent=rejected?`本批有 ${rejected} 项已退回，请修正内容后重新处理。`:pending?`已完成 ${resolved} / ${total} 项复核，全部确认后即可发布。`:`${total} 项复核已完成，可以发布给学生。`;panel.append(status);
      if(pending||rejected||!total)return panel;
      const form=document.createElement("form");form.className="publish-form";const label=document.createElement("label");label.textContent="内容版本";const input=document.createElement("input");input.value="1.0.0";input.required=true;input.pattern="\\d+\\.\\d+\\.\\d+";input.inputMode="numeric";input.setAttribute("aria-label","内容版本");label.append(input);const button=document.createElement("button");button.className="btn cinnabar";button.type="submit";button.textContent="发布给学生";form.append(label,button);
      const feedback=document.createElement("p");feedback.className="muted";feedback.setAttribute("aria-live","polite");
      form.onsubmit=async(event)=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;feedback.textContent="正在进行发布前检查…";const response=await apiFetch("/api/content/publish",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chapter_id:run.chapter_id,version:input.value.trim(),quality_profile:"generic"})});const data=await response.json();if(response.ok){feedback.textContent="内容已发布，学生现在可以开始使用。";await loadRuns();return;}const failed=(data.validation_report?.checks||[]).filter((check)=>!check.passed).map((check)=>check.check);feedback.textContent=data.error==="review_gate_not_passed"?"仍有复核事项未完成，请刷新后继续复核。":data.error==="version already published"?"这个版本号已经使用，请填写新的版本号。":failed.length?`发布前检查发现 ${failed.length} 项内容需要修正。`:"暂时无法发布，请稍后重试。";button.disabled=false;};
      panel.append(form,feedback);return panel;
    }
    async function loadRuns(focusRunId=""){const response=await apiFetch("/api/content/pipelines"),data=await response.json();$("runs").replaceChildren();const runs=data.runs||[];
      if(!runs.length){$("runs").innerHTML='<div class="empty-note">还没有内容任务。添加一批资料开始整理。</div>';return;}
      const progressEntries=await Promise.all(runs.filter((run)=>run.status==="review_ready").map(async(run)=>[run.run_id,await reviewProgress(run)]));const progressByRun=new Map(progressEntries);
      for(const run of runs){const card=document.createElement("article");card.className=`run-card ${run.status}`;card.dataset.runId=run.run_id;card.tabIndex=-1;const head=document.createElement("div");head.className="run-card-head";const title=document.createElement("div");title.innerHTML='<strong></strong><small></small>';title.querySelector("strong").textContent=`${statusName[run.status]||run.status} · ${stageName[run.stage]||run.stage}`;title.querySelector("small").textContent=`${new Date(run.created_at).toLocaleString()} · ${run.library_visibility==="public"?"公共内容库":"我的内容库"}`;const tag=document.createElement("span");tag.className="paper-tag";tag.textContent=`${run.document_ids?.length||0} 个文件`;head.append(title,tag);const rail=document.createElement("div");rail.className="stage-rail";for(const s of ["upload","ktq","er","review"]){const span=document.createElement("span");span.textContent=stageName[s];span.className=(["upload","ktq","er","review"].indexOf(s)<=["upload","ktq","er","review"].indexOf(run.stage))?"reached":"";rail.append(span);}
        const files=Array.isArray(run.payload?.files)?run.payload.files:[];const checklist=document.createElement("ul");checklist.className="run-file-checklist";checklist.setAttribute("aria-label","本次资料清单");for(const [index,file] of files.entries()){const item=document.createElement("li");const name=document.createElement("span");name.textContent=file.name||`文件 ${index+1}`;item.append(name);if(file.duplicate){const duplicate=document.createElement("small");duplicate.textContent="已有相同文件，将复用原件";item.append(duplicate);}if(run.status==="draft"&&file.document_id){const remove=document.createElement("button");remove.type="button";remove.className="text-button";remove.textContent="移除";remove.onclick=async()=>{remove.disabled=true;const response=await apiFetch(`/api/content/pipelines/${encodeURIComponent(run.run_id)}/files/${encodeURIComponent(file.document_id)}`,{method:"DELETE"});if(!response.ok){remove.disabled=false;$("uploadFeedback").textContent="暂时无法移除这份文件，请刷新后重试。";return;}await loadRuns(run.run_id);};item.append(remove);}checklist.append(item);}if(!files.length){const item=document.createElement("li");item.textContent="资料集暂时为空，请继续添加文件";checklist.append(item);}
        const actions=document.createElement("div");actions.className="action-cluster";
        if(run.status==="draft"){const addInput=document.createElement("input");addInput.type="file";addInput.multiple=true;addInput.hidden=true;const addMore=document.createElement("button");addMore.className="btn ghost";addMore.type="button";addMore.textContent="继续添加文件";addMore.onclick=()=>addInput.click();addInput.onchange=async()=>{const pending=[...addInput.files];if(!pending.length)return;if((run.document_ids?.length||0)+pending.length>100){$("uploadFeedback").textContent="一个资料集最多保存 100 个文件。";return;}if(pending.some(file=>file.size>20*1048576)){$("uploadFeedback").textContent="请移除超过 20 MiB 的文件后继续。";return;}addMore.disabled=true;try{await appendFiles(run.run_id,pending,(current,total)=>{$("uploadFeedback").textContent=`正在追加 ${current} / ${total}…`;});$("uploadFeedback").textContent="文件已添加，请继续检查清单。";await loadRuns(run.run_id);}catch(error){$("uploadFeedback").textContent=`部分文件可能已保存：${error.message}`;await loadRuns(run.run_id);}finally{addMore.disabled=false;}};const confirm=document.createElement("button");confirm.className="btn cinnabar";confirm.type="button";confirm.textContent="确认清单，开始处理";confirm.disabled=!(run.document_ids?.length);confirm.onclick=async()=>{confirm.disabled=true;const response=await apiFetch(`/api/content/pipelines/${encodeURIComponent(run.run_id)}/confirm`,{method:"POST"});const data=await response.json();if(!response.ok){confirm.disabled=false;$("uploadFeedback").textContent=data.error==="pipeline has no files"?"请先添加至少一份资料。":`无法开始处理：${data.error||response.status}`;return;}$("uploadFeedback").textContent="任务已开始。你可以打开对话查看进度。";await loadRuns();};actions.append(addInput,addMore,confirm);}
        else {if(["ktq","er","review"].includes(run.stage)&&run.ktq_session_ref)actions.append(sessionLink(run.ktq_session_ref,"打开题目整理对话"));if(["er","review"].includes(run.stage)&&run.er_session_ref)actions.append(sessionLink(run.er_session_ref,"打开诊断研究对话"));}
        if(run.status==="review_ready"){const a=document.createElement("a");a.className="btn cinnabar";a.href=`/teacher.html?view=review&queue=content&pipeline=${encodeURIComponent(run.run_id)}`;const pending=Number(progressByRun.get(run.run_id)?.pending_count||0);a.textContent=pending?`继续复核（${pending}）`:"查看复核";actions.append(a);}if(run.error_detail){const e=document.createElement("p");e.className="status-note warning";e.textContent=`处理遇到问题：${run.error_detail}`;card.append(head,rail,checklist,e,actions);}else card.append(head,rail,checklist,actions);if(run.status==="review_ready")card.append(publishPanel(run,progressByRun.get(run.run_id)));if(run.status==="published"&&run.payload?.publication){const done=document.createElement("p");done.className="status-note success";done.textContent=`版本 ${run.payload.publication.version} 已发布`;card.append(done);}$("runs").append(card);}
      if(focusRunId){const target=$("runs").querySelector(`[data-run-id="${CSS.escape(focusRunId)}"]`);if(target){target.focus({preventScroll:true});target.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});}}
    }
    $("refresh").onclick=loadRuns;await loadRuns();setInterval(()=>{if(!document.hidden&&!$("runs").contains(document.activeElement))loadRuns();},5000);
  </script>
</body></html>
