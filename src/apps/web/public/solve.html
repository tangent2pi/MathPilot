<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单题诊断 · AGMATH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/"><span class="mark">◆</span>AGMATH<small>数学诊断卷宗</small></a>
    <nav>
      <a href="/">每日练习</a>
      <a href="/report.html">报告与计划</a>
      <a href="/teacher.html">教师复核</a>
      <a href="/solve.html" aria-current="page">单题诊断</a>
    </nav>
  </header>

  <main class="dossier">
    <aside class="evidence-rail" aria-label="证据目录">
      <div class="rail-title">证据目录</div>
      <a class="rail-item" href="#q" data-ev="出题"><span class="no">01</span>出题</a>
      <a class="rail-item" href="#answer" data-ev="作答"><span class="no">02</span>作答</a>
      <a class="rail-item" href="#verdict" data-ev="判定"><span class="no">03</span>判定</a>
      <a class="rail-item" href="#probe" data-ev="追问"><span class="no">04</span>错因追问</a>
      <a class="rail-item" href="#baseline" data-ev="程序基准"><span class="no">05</span>程序基准</a>
      <a class="rail-item" href="#queue" data-ev="画像队列"><span class="no">06</span>画像队列</a>
    </aside>

    <section class="flow" aria-label="学习流">
      <div class="seals" id="seals" aria-label="Session 状态">
        <span class="seal" data-state="CREATE">创建</span>
        <span class="seal" data-state="SUBMIT">提交</span>
        <span class="seal" data-state="GRADE">判答</span>
        <span class="seal" data-state="DIAGNOSE">错因归因</span>
        <span class="seal" data-state="SCIENTIFIC_EVALUATE">程序评价</span>
        <span class="seal" data-state="QUEUE_DREAM">画像队列</span>
      </div>

      <article class="question-card" id="q">
        <div class="q-meta">
          <span id="qid">Q_TRI_012</span>
          <span id="pkgVer" class="mono">0.1.0</span>
          <span class="mode-tag" id="modeTag">诊断</span>
          <span class="indep-tag">计入独立证据</span>
        </div>
        <p class="q-stem" id="stem">在△ABC中，已知 a=√3，b=2，A=30°。求角 B（注意讨论解的个数）。</p>
      </article>

      <section class="answer-panel" id="answer" hidden>
        <label for="answerText" id="answerLabel">你的解答</label>
        <textarea id="answerText" rows="4" placeholder="写下你的解答…（LaTeX 或文字均可）"></textarea>
        <div class="answer-actions">
          <span class="pending-line" id="grading" hidden><span class="spinner"></span>Teaching Agent 判读中（推理模型，可能需 30–90 秒）…</span>
          <button class="btn" id="submitBtn" type="button">提交答案</button>
        </div>
      </section>

      <div id="verdictSlot"></div>
      <div id="probeSlot"></div>
      <div id="baselineSlot"></div>
      <div id="queueSlot"></div>

      <div class="empty-note" id="startNote">卷宗待启。开始本题后，判定、追问与证据会按顺序落在这里。</div>
    </section>

    <aside class="draft-pane" aria-label="草稿区">
      <div class="draft-title"><span>草稿区</span><span>未启用</span></div>
      <div class="draft-sheet">
        <div class="draft-placeholder">手写草稿空间<br /><span style="font-size:.7rem">设备支持时启用；无草稿不影响诊断</span></div>
      </div>
    </aside>
  </main>

  <div class="action-bar" role="toolbar" aria-label="本题动作">
    <button class="btn ghost" id="actDone" type="button">完成本题</button>
    <span class="hint-level" id="hintLevelBar">L0 · 无提示</span>
  </div>

  <script>
    const API = "";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
      (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const SEAL_ORDER = ["CREATE", "SUBMIT", "GRADE", "DIAGNOSE", "SCIENTIFIC_EVALUATE", "QUEUE_DREAM"];
    const ZH_VERDICT = { correct: "正确", partially_correct: "部分正确", incorrect: "不正确", unresolved: "待核" };
    const VERDICT_CLS = { correct: "ok", partially_correct: "partial", incorrect: "bad", unresolved: "" };
    const RUBRIC_ZH = { met: "达成", not_met: "未达成", unclear: "待澄清" };

    let sessionId = null;
    let flowState = 0;
    let probeRound = 0;

    function stamp(state) {
      const el = document.querySelector(`.seal[data-state="${state}"]`);
      if (!el) return;
      el.classList.remove("done");
      void el.offsetWidth;
      el.classList.add("stamping", "done");
    }
    function advance(to) {
      const idx = SEAL_ORDER.indexOf(to);
      for (let i = flowState; i <= idx; i++) stamp(SEAL_ORDER[i]);
      flowState = Math.max(flowState, idx + 1);
      document.querySelectorAll(".rail-item").forEach((r, i) => r.classList.toggle("done", i <= idx));
    }
    const evidenceHtml = (k, id, inner) =>
      `<article class="evidence"><div class="ev-head"><span class="ev-k">${esc(k)}</span>` +
      (id ? `<span class="ev-id">${esc(id)}</span>` : "") + `</div>${inner}</article>`;

    function renderVerdict(judgment) {
      const v = judgment?.verdict;
      document.getElementById("verdictSlot").innerHTML = evidenceHtml("判定 · ANSWER JUDGMENT", judgment?.judgment_id ?? "",
        `<div class="verdict-seal"><span class="stamp ${esc(VERDICT_CLS[v])} landing">${esc(ZH_VERDICT[v] ?? v)}` +
        `<span class="zh">${esc(judgment?.uncertainty ?? "")}${v === "unresolved" ? "·待复核" : ""}</span></span>` +
        `<p class="verdict-note">${v === "unresolved" ? "判定不确定，已进入教师复核队列。" : "模型主判 · 按评分点逐项判定"}</p></div>` +
        `<p class="verdict-summary">${esc(judgment?.decision_summary ?? "")}</p>` +
        `<ul class="rubric-list">${(judgment?.rubric_items ?? []).map((r) =>
          `<li><span class="mark ${esc(r.status)}">${esc(RUBRIC_ZH[r.status] ?? r.status)}</span><span>${esc(r.id)}</span></li>`).join("")}</ul>`);
      advance("GRADE");
    }
    function renderClosed(d) {
      const ser = d.scientific_evaluation_report;
      if (ser) {
        document.getElementById("baselineSlot").innerHTML = evidenceHtml("程序基准 · SCIENTIFIC EVALUATION", ser.report_id ?? "",
          `<div class="baseline"><span class="big-number">${esc(ser.p_bkt_baseline)}<small>P(掌握)</small></span>` +
          `<span class="prior-flag">${esc(ser.calibration_status)} · 未校准</span>` +
          `<span class="mono-line">独立观测 ${esc(ser.independent_observation_count)} 次 · 参数集 ${esc(ser.parameter_set_id)}</span></div>`);
        advance("SCIENTIFIC_EVALUATE");
      }
      document.getElementById("queueSlot").innerHTML = evidenceHtml("画像队列", d.session_learning_record_id ?? "",
        `<p class="teaching-summary">双产物已封装并入队。长期画像只在 Dream 整理后更新——到<a href="/report.html">报告与计划</a>查看。</p>`);
      advance("QUEUE_DREAM");
    }
    // 卡片事件（§5.4：submitted/skipped/bypassed_free_text 统一交互协议）
    async function cardEvent(cardId, responseType, payload = {}) {
      try {
        await fetch(`${API}/api/sessions/${sessionId}/card-event`, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ card_id: cardId, response_type: responseType, payload }),
        });
      } catch { /* 事件丢失不阻塞主流程（审计事件尽力而为） */ }
    }

    async function renderProbe(probe, card, round, max) {
      probeRound = round;
      const cardId = card?.card_id ?? "";
      document.getElementById("probeSlot").innerHTML = evidenceHtml(`错因追问 · PROBE ${round}/${max}`, card?.artifact_id ? `artifact://…/${esc(card.artifact_id)}` : "",
        `<div class="probe-card">
          <div class="p-head"><span class="p-k">消歧追问卡（可跳过或直接回复）</span><span class="p-skip" id="probeSkip">跳过，不作答</span></div>
          <p class="teaching-summary">${esc(probe?.question ?? card?.prompt ?? "")}</p>
          <textarea id="probeAnswer" rows="2" style="width:100%;border:1px solid var(--hairline);font:inherit;padding:.6rem" placeholder="回答这个追问…"></textarea>
          <div class="probe-options">
            <button class="btn" id="probeSubmit" type="button">提交答案</button>
            <button class="btn ghost" id="probeFreeText" type="button">不作答，直接回复</button>
          </div>
        </div>`);
      document.getElementById("probeSlot").scrollIntoView({ behavior: "smooth", block: "center" });

      const sendProbe = async (answer) => {
        const res = await fetch(`${API}/api/sessions/${sessionId}/probe`, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ answer_text: answer }),
        });
        const d = await res.json();
        if (!res.ok) {
          document.getElementById("probeSlot").innerHTML = `<div class="error-card">追问失败：${esc(d.error ?? res.status)}</div>`;
          return;
        }
        document.getElementById("probeSlot").innerHTML = evidenceHtml("错因追问 · 已作答", "",
          `<p class="verdict-note">追问 ${round} 已判答：${esc(d.probe?.verdict ?? d.claim?.status ?? "已处理")}</p>`);
        if (d.scientific_evaluation_report || d.session_learning_record_id) {
          advance("DIAGNOSE");
          renderClosed(d);
        } else if (d.probe) {
          renderProbe(d.probe, d.card, d.probe_rounds, d.max_probe_rounds);
        }
      };

      document.getElementById("probeSubmit").onclick = async () => {
        const answer = document.getElementById("probeAnswer").value.trim();
        if (!answer) return;
        document.getElementById("probeSubmit").disabled = true;
        if (cardId) await cardEvent(cardId, "submitted", { answer });
        await sendProbe(answer);
      };
      document.getElementById("probeFreeText").onclick = async () => {
        const answer = document.getElementById("probeAnswer").value.trim();
        if (cardId) await cardEvent(cardId, "bypassed_free_text", { answer });
        await sendProbe(answer || "（直接回复，未作答卡片）");
      };
      document.getElementById("probeSkip").onclick = async () => {
        // 跳过即闭合（D.2）：只记录事件，不产生失败观测；服务端正常产出双产物进 Dream
        if (cardId) cardEvent(cardId, "skipped");
        const res = await fetch(`${API}/api/sessions/${sessionId}/probe-skip`, {
          method: "POST", headers: { "content-type": "application/json" },
        });
        const d = await res.json();
        if (!res.ok) {
          document.getElementById("probeSlot").innerHTML =
            `<div class="error-card">跳过失败：${esc(d.error ?? res.status)}</div>`;
          return;
        }
        document.getElementById("probeSlot").innerHTML = evidenceHtml("错因追问 · 跳过", "",
          `<p class="verdict-note">已跳过追问——只记录事件，不产生失败观测（设计 §1.1-10）。本题证据已封装。</p>`);
        advance("DIAGNOSE");
        renderClosed(d);
      };
    }

    document.getElementById("actDone").onclick = () => {
      if (!sessionId) return;
      document.getElementById("queueSlot").innerHTML = evidenceHtml("画像队列", "",
        `<p class="teaching-summary">本题已结束。查看<a href="/report.html">报告与计划</a>。</p>`);
    };

    const startBtn = document.createElement("button");
    startBtn.className = "btn cinnabar"; startBtn.textContent = "开始本题"; startBtn.id = "startBtn";
    document.getElementById("startNote").appendChild(startBtn);
    startBtn.onclick = async () => {
      const res = await fetch(`${API}/api/sessions`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ student_id: "usr_student01", question_id: "Q_TRI_012",
          chapter_package_version: "0.1.0", mode: "diagnostic", draft_enabled: false }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("startNote").innerHTML =
          `<div class="error-card">无法创建会话：${esc(data.error ?? res.status)}<span class="code">${esc(data.detail ?? "")}</span></div>`;
        return;
      }
      sessionId = data.session_id;
      document.getElementById("startNote").hidden = true;
      document.getElementById("answer").hidden = false;
      document.getElementById("qid").textContent = data.question_id;
      document.getElementById("pkgVer").textContent = data.chapter_package_version;
      stamp("CREATE"); flowState = 1;
    };

    document.getElementById("submitBtn").onclick = async () => {
      const answer = document.getElementById("answerText").value.trim();
      if (!answer || !sessionId) return;
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("grading").hidden = false;
      advance("SUBMIT");
      let res, data;
      try {
        res = await fetch(`${API}/api/sessions/${sessionId}/submit`, {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ answer_text: answer }),
        });
        data = await res.json();
      } catch {
        document.getElementById("grading").hidden = true;
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("verdictSlot").innerHTML =
          `<div class="error-card">请求失败：网络错误或服务不可达。<span class="code">network_error</span></div>`;
        return;
      }
      document.getElementById("grading").hidden = true;
      document.getElementById("submitBtn").disabled = false;
      if (!res.ok) {
        const msgs = { 502: "判答模型暂不可用（限流或超时）。系统不会伪造判定——请稍后重试。",
          409: "会话状态不允许此操作。", 404: "会话不存在或题目未发布。", 422: "提交内容不合法。" };
        document.getElementById("verdictSlot").innerHTML =
          `<div class="error-card">${esc(msgs[res.status] ?? "判答被拒绝。")}<span class="code">${esc(data.error ?? res.status)}</span></div>`;
        return;
      }
      renderVerdict(data.judgment);
      // 追问路径：partial/incorrect → PROBE_AWAIT（教学卡片协议渲染）；正确/待核 → 直接关闭
      if (data.probe && data.state === "PROBE_AWAIT") {
        document.getElementById("answer").hidden = true;
        advance("DIAGNOSE");
        renderProbe(data.probe, data.card, data.probe_rounds, data.max_probe_rounds);
      } else {
        renderClosed(data);
      }
    };
  </script>
</body>
</html>
