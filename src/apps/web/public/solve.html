<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>练习 · AGMATH</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/math-render.css">
</head>
<body class="proof-ui" data-page-title="练习">
  <header class="app-header" data-app-shell aria-label="应用顶栏"></header>

  <main class="proof-layout">
    <aside class="proof-spine" aria-label="本题状态">
      <p class="eyebrow">本题进度</p>
      <ol id="stateSpine">
        <li class="active">查看题目</li><li>写下解答</li><li>检查解答</li><li>进一步提问</li><li>本题总结</li>
      </ol>
      <div class="hint-meter" id="hintMeter">L0 · 独立作答</div>
    </aside>

    <section class="proof-main">
      <div id="freeAsk" class="proof-sheet" hidden>
        <p class="eyebrow">自由问答</p>
        <h1>把题目发给我</h1>
        <p class="lede">输入题目或上传截图，我们可以从你的问题开始一步步讨论。</p>
        <textarea id="askText" rows="5" placeholder="例如：这道几何题为什么要作这条辅助线？"></textarea>
        <div class="file-row"><label class="file-chip">上传题图<input id="askImages" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><span id="askFileMeta"></span></div>
        <button class="btn cinnabar" id="askSend" type="button">发送问题</button>
        <div id="askConversation" class="conversation" aria-live="polite"></div>
        <div id="askArtifacts" class="artifact-deck"></div>
      </div>

      <article id="questionSheet" class="proof-sheet" hidden>
        <div class="q-meta"><span id="qid"></span><span id="pkgVer" class="mono"></span><span>当前练习</span></div>
        <h1 id="stem">读取已发布题目…</h1>
        <div id="questionAssets" class="asset-grid"></div>
      </article>

      <section id="workspace" class="proof-sheet" hidden>
        <div class="sheet-heading"><div><p class="eyebrow">我的解答</p><h2>写下你的思路</h2></div><span id="sessionLabel" class="mono"></span></div>
        <div id="answerControl" class="answer-control"></div>
        <textarea id="answerText" rows="6" placeholder="逐步写下你的解答；检查某一步时，请指出要检查的位置。"></textarea>
        <div class="file-row"><label class="file-chip">补充作答图片<input id="answerImages" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><span id="answerFileMeta">最多 4 张</span></div>
        <div class="action-cluster" aria-label="学习帮助方式">
          <button class="btn ghost" data-action="stuck" type="button">给我一个提示</button>
          <button class="btn ghost" data-action="check_step" type="button">检查这一步</button>
          <button class="btn ghost" data-action="method_hint" type="button">换一种思路</button>
          <button class="btn cinnabar" id="submitAnswer" type="button">提交解答</button>
        </div>
        <p id="busy" class="pending-line" hidden><span class="spinner"></span>正在阅读你的解答…</p>
      </section>

      <section id="dialogueSheet" class="proof-sheet" hidden>
        <div class="sheet-heading"><div><p class="eyebrow">教学对话</p><h2>一起把这道题想清楚</h2></div><span class="live-dot">对话中</span></div>
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <div id="artifacts" class="artifact-deck"></div>
      </section>

      <section id="verdictSheet" class="proof-sheet" hidden>
        <p class="eyebrow">本题反馈</p><div id="verdict"></div><div id="probe"></div>
        <div id="runActions" class="action-cluster" hidden></div>
      </section>

      <details id="stepsSheet" class="proof-sheet model-steps" hidden>
        <summary>查看处理过程 <span id="usage" class="mono"></span></summary>
        <ol id="steps"></ol>
      </details>
    </section>

    <aside id="draftPane" class="draft-studio" hidden>
      <div class="sheet-heading"><div><p class="eyebrow">草稿</p><h2>手写区</h2></div><button id="clearDraft" class="text-button" type="button">清空</button></div>
      <canvas id="draftCanvas" width="420" height="520" aria-label="手写草稿画布"></canvas>
      <p>草稿会随本题保存，提问和提交时会一起用于理解你的思路。</p>
    </aside>
  </main>

  <script type="module">
    import { requirePrincipal, apiFetch } from "/assets/app-shell.js";
    import { renderMath } from "/assets/math-render.js";
    const principal = await requirePrincipal();
    const params = new URLSearchParams(location.search);
    let sessionId = null, conversationId = null, eventSource = null, strokeCount = 0, drawing = false;
    const assessmentRunId = params.get("run");
    const assessmentGoal = params.get("goal") || "coverage";
    let lastJudgment = null, currentProbeCard = null;
    let question = null;
    const $ = (id) => document.getElementById(id);
    const setBusy = (on) => { $("busy").hidden = !on; document.querySelectorAll("button").forEach((b) => { if (!b.closest("#authIdentity")) b.disabled = on; }); };

    async function filesToImages(input) {
      const files = [...input.files].slice(0, 4);
      const images = await Promise.all(files.map((file) => new Promise((resolve, reject) => {
        const reader = new FileReader(); reader.onerror = reject;
        reader.onload = () => resolve({ data: String(reader.result).split(",")[1], mimeType: file.type });
        reader.readAsDataURL(file);
      })));
      return images;
    }
    function addMessage(role, text, label = "") {
      const item = document.createElement("article"); item.className = `message-row ${role === "student" ? "user" : "assistant"}`;
      const avatar = document.createElement("span"); avatar.className = "message-avatar"; avatar.textContent = role === "student" ? "你" : "∴";
      const wrap = document.createElement("div"); wrap.className = "message-wrap"; const head = document.createElement("div"); head.className = "message-head";
      const name = document.createElement("strong"); name.textContent = role === "agent" ? "AGMATH" : "你"; const tag = document.createElement("small"); tag.textContent = label || ""; head.append(name, tag);
      const body = document.createElement("div"); body.className = "message-bubble"; body.textContent = text; renderMath(body); wrap.append(head, body); item.append(avatar, wrap); $(sessionId ? "conversation" : "askConversation").append(item);
      item.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
    }
    function safeUri(uri, kind) {
      if (!uri) return null;
      if (kind === "image" && /^data:image\/(png|jpeg|webp);base64,/.test(uri)) return uri;
      const ref = sessionId || conversationId;
      if (ref && uri.startsWith(`/api/sessions/${encodeURIComponent(ref)}/artifacts/`)) return uri;
      return null;
    }
    async function renderArtifacts(items = []) {
      const host = $(sessionId ? "artifacts" : "askArtifacts"); host.replaceChildren();
      for (const artifact of items) {
        const card = document.createElement("article"); card.className = "artifact-card";
        const title = document.createElement("strong"); title.textContent = artifact.title || artifact.kind; card.append(title);
        if (artifact.kind === "text") { const p = document.createElement("p"); p.textContent = artifact.content || ""; card.append(p); }
        else if (artifact.kind === "question_card") {
          let spec = null;
          try { spec = artifact.content ? JSON.parse(artifact.content) : safeUri(artifact.uri, "card") ? await (await apiFetch(artifact.uri)).json() : null; } catch { spec = null; }
          const prompt = document.createElement("p"); prompt.textContent = spec?.prompt || spec?.question || artifact.content || "交互题卡"; card.append(prompt);
          const input = document.createElement("textarea"); input.rows = 2; input.placeholder = "写下你的回答"; card.append(input);
          const actions = document.createElement("div"); actions.className = "action-cluster";
          for (const [label, responseType] of [["提交卡片", "submitted"], ["跳过", "skipped"], ["直接文字回复", "bypassed_free_text"]]) {
            const button = document.createElement("button"); button.className = responseType === "submitted" ? "btn" : "btn ghost"; button.type = "button"; button.textContent = label;
            button.onclick = () => handleCardEvent(artifact, { type: `card.${responseType === "submitted" ? "answer_submitted" : responseType === "skipped" ? "skipped" : "free_text_requested"}`, card_id: spec?.card_id || artifact.artifact_id, answer: input.value });
            actions.append(button);
          }
          card.append(actions);
        }
        else if (artifact.kind === "image" && safeUri(artifact.uri, "image")) { const img = new Image(); img.src = safeUri(artifact.uri, "image"); img.alt = artifact.title || "教学图片"; card.append(img); }
        else if (artifact.kind === "video" && safeUri(artifact.uri, "video")) { const video = document.createElement("video"); video.src = safeUri(artifact.uri, "video"); video.controls = true; video.preload = "metadata"; card.append(video); }
        else if (artifact.kind === "html" && safeUri(artifact.uri, "html")) { const f = document.createElement("iframe"); f.sandbox = "allow-scripts"; f.src = `${safeUri(artifact.uri, "html")}?interaction_token=${encodeURIComponent(artifact.interaction_token || "")}`; f.title = artifact.title || "教学演示"; f.dataset.artifactId = artifact.artifact_id || ""; f.dataset.interactionToken = artifact.interaction_token || ""; card.append(f); }
        else { const p = document.createElement("p"); p.textContent = "这项互动内容正在准备，你可以先继续文字对话。"; card.append(p); }
        renderMath(card); host.append(card);
      }
    }
    async function handleCardEvent(artifact, data) {
      const ref = sessionId || conversationId;
      if (!ref || !["card.answer_submitted", "card.skipped", "card.free_text_requested"].includes(data?.type)) return;
      const responseType = ({ "card.answer_submitted": "submitted", "card.skipped": "skipped", "card.free_text_requested": "bypassed_free_text" })[data.type];
      const cardId = String(data.card_id || artifact.artifact_id || "").slice(0, 160);
      const payload = { answer: String(data.answer ?? "").slice(0, 4000), source: "learning_artifact" };
      const eventUrl = sessionId ? `/api/sessions/${sessionId}/card-event` : `/api/teaching-conversations/${conversationId}/card-event`;
      const saved = await apiFetch(eventUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ card_id: cardId, artifact_id: artifact.artifact_id, interaction_token: artifact.interaction_token, response_type: responseType, payload }) });
      if (!saved.ok) { addMessage("agent", "这次互动没有保存成功，请直接用文字回复。", "提示"); return; }
      if (responseType === "bypassed_free_text") { $(sessionId ? "answerText" : "askText").focus(); return; }
      if (sessionId) $("dialogueSheet").hidden = false;
      addMessage("student", responseType === "skipped" ? "跳过这张教学卡片" : `卡片回答：${payload.answer || "（已提交）"}`, "教学卡片");
      const followup = { action: "card_event", text: JSON.stringify({ response_type: responseType, card_id: cardId, payload }) };
      const reply = await apiFetch(sessionId ? `/api/sessions/${sessionId}/interact` : "/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(sessionId ? followup : { ...followup, conversation_id: conversationId }) });
      const result = await reply.json();
      if (reply.ok) { addMessage("agent", result.reply, result.status); await renderArtifacts(result.artifacts); }
      else addMessage("agent", "回答已经保存，但暂时没有收到后续回复。你可以再发一条消息。", "提示");
    }
    window.addEventListener("message", (event) => {
      if (event.origin !== "null") return;
      const frame = [...document.querySelectorAll("#artifacts iframe, #askArtifacts iframe")].find((item) => item.contentWindow === event.source);
      if (!frame) return;
      const artifact = { artifact_id: frame.dataset.artifactId, interaction_token: frame.dataset.interactionToken };
      if (!event.data || event.data.interaction_token !== artifact.interaction_token) return;
      handleCardEvent(artifact, event.data);
    });
    function renderTrace(data) {
      $("stepsSheet").hidden = false;
      const list = $("steps"); list.replaceChildren();
      let tokens = 0, promptInput = 0, cacheRead = 0;
      for (const step of (data.steps || []).slice(-80)) {
        const li = document.createElement("li");
        const state = document.createElement("span"); state.className = `step-state ${step.status || "running"}`; state.textContent = step.status || "running";
        const text = document.createElement("span"); text.textContent = `${step.taskType || "agent"} · ${step.label || step.detail || "处理中"}`;
        li.append(state, text); list.append(li); tokens += Number(step.usage?.total || 0);
        promptInput += Number(step.usage?.input || 0); cacheRead += Number(step.usage?.cacheRead || 0);
      }
      const promptTokens = promptInput + cacheRead;
      const cacheText = promptTokens ? ` · 提示缓存 ${Math.round(cacheRead / promptTokens * 100)}%` : "";
      $("usage").textContent = tokens ? `${tokens.toLocaleString()} tokens${cacheText}` : "";
    }
    function connectEvents() {
      const ref = sessionId || conversationId; if (!ref) return;
      eventSource?.close(); eventSource = new EventSource(`/api/sessions/${encodeURIComponent(ref)}/agent-events`);
      eventSource.addEventListener("trace", (event) => renderTrace(JSON.parse(event.data)));
    }

    async function canvasImage() {
      if (!strokeCount) return null;
      const url = $("draftCanvas").toDataURL("image/png");
      const raw = Uint8Array.from(atob(url.split(",")[1]), (c) => c.charCodeAt(0));
      const digest = [...new Uint8Array(await crypto.subtle.digest("SHA-256", raw))].map((b) => b.toString(16).padStart(2, "0")).join("");
      await apiFetch(`/api/sessions/${sessionId}/draft`, { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ segment_id: "draft-main", content_hash: `sha256:${digest}`, event_count: strokeCount, bbox: [0,0,420,520] }) });
      return { data: url.split(",")[1], mimeType: "image/png" };
    }
    function setupCanvas() {
      const c = $("draftCanvas"), ctx = c.getContext("2d");
      ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#17233B";
      const point = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]; };
      c.onpointerdown = (e) => { drawing = true; c.setPointerCapture(e.pointerId); const [x,y]=point(e); ctx.beginPath(); ctx.moveTo(x,y); };
      c.onpointermove = (e) => { if (!drawing) return; const [x,y]=point(e); ctx.lineTo(x,y); ctx.stroke(); strokeCount++; };
      c.onpointerup = () => { drawing = false; };
      $("clearDraft").onclick = () => { ctx.clearRect(0,0,c.width,c.height); strokeCount=0; };
    }

    function renderAnswerControl(q) {
      const host = $("answerControl"); host.replaceChildren();
      const options = Array.isArray(q.options) ? q.options : [];
      if (!["single_choice", "multiple_choice", "true_false"].includes(q.stem_format)) return;
      const choices = q.stem_format === "true_false"
        ? [{ key: "true", text_markdown: "正确" }, { key: "false", text_markdown: "错误" }]
        : options;
      const legend = document.createElement("p"); legend.className = "eyebrow";
      legend.textContent = q.stem_format === "multiple_choice" ? "可选择多项" : "请选择一项";
      host.append(legend);
      for (const choice of choices) {
        const label = document.createElement("label"); label.className = "answer-choice";
        const input = document.createElement("input");
        input.type = q.stem_format === "multiple_choice" ? "checkbox" : "radio";
        input.name = "structured-answer"; input.value = choice.key;
        const key = document.createElement("strong"); key.textContent = choice.key.toUpperCase();
        const body = document.createElement("span"); body.textContent = choice.text_markdown;
        label.append(input, key, body); renderMath(body); host.append(label);
      }
    }

    function collectAnswer() {
      const selected = [...document.querySelectorAll('#answerControl input:checked')].map((i) => i.value.toUpperCase());
      const detail = $("answerText").value.trim();
      if (!selected.length) return detail;
      return `${question?.stem_format === "multiple_choice" ? "选择答案" : "答案"}：${selected.join("、")}${detail ? `\n推导说明：${detail}` : ""}`;
    }

    async function interact(action) {
      const text = collectAnswer();
      if (action === "check_step" && !text) { $("answerText").focus(); return; }
      setBusy(true); $("dialogueSheet").hidden = false; addMessage("student", text || ({stuck:"请给我一个提示",method_hint:"请换一种思路讲解"}[action]), "");
      try {
        const images = await filesToImages($("answerImages")); const draft = await canvasImage(); if (draft) images.push(draft);
        const res = await apiFetch(`/api/sessions/${sessionId}/interact`, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({action,text,images:images.slice(0,4)}) });
        const data = await res.json(); if (!res.ok) throw new Error(data.detail || data.error || String(res.status));
        addMessage("agent", data.reply, data.status === "completed" ? "" : data.status); renderArtifacts(data.artifacts); $("hintMeter").textContent = `提示 L${data.hint_level}`;
      } catch (e) { addMessage("agent", "这次回复没有完成，请稍后再试。" , "提示"); } finally { setBusy(false); }
    }

    async function advanceAssessment() {
      if (!assessmentRunId) return;
      const host = $("runActions"); host.replaceChildren(); host.hidden = false;
      const status = document.createElement("p"); status.className = "pending-line"; status.textContent = "正在安排下一步学习…"; host.append(status);
      const decided = await apiFetch(`/api/assessment-runs/${encodeURIComponent(assessmentRunId)}/decide`, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({session_id:sessionId}) });
      const d = await decided.json();
      if (!decided.ok) { status.textContent = "暂时无法选择下一题，请稍后再试。"; return; }
      if (d.stop) { status.textContent = `本轮已完成：${d.reason || "证据已足够"}`; const a=document.createElement("a");a.className="btn cinnabar";a.href="/report.html";a.textContent="查看报告与计划";host.append(a);return; }
      const next = await apiFetch(`/api/assessment-runs/${encodeURIComponent(assessmentRunId)}/next`, { method:"POST" });
      const n = await next.json();
      if (!next.ok || !n.question_id) { status.textContent = n.detail || n.error || "本轮没有更多合适题目"; return; }
      status.textContent = `${d.reason || "已确定下一诊断目标"} · 正在进入下一题`;
      location.href = `/solve.html?run=${encodeURIComponent(assessmentRunId)}&goal=${encodeURIComponent(n.goal || d.goal || "coverage")}&q=${encodeURIComponent(n.question_id)}`;
    }

    function showCompletion(data) {
      if (data.state !== "CLOSED" && !data.session_learning_record_id) return;
      const host = $("runActions"); host.replaceChildren(); host.hidden = false;
      if (assessmentRunId) {
        const next = document.createElement("button"); next.className="btn cinnabar"; next.type="button"; next.textContent="继续下一题"; next.onclick=()=>{next.disabled=true;advanceAssessment()}; host.append(next);
      }
      const report = document.createElement("a"); report.className="btn ghost"; report.href="/report.html"; report.textContent="查看当前证据"; host.append(report);
    }

    function renderVerdict(data) {
      $("verdictSheet").hidden = false;
      if (data.judgment) lastJudgment = data.judgment;
      if (data.card) currentProbeCard = data.card;
      const j = lastJudgment || {};
      $("verdict").replaceChildren(); const seal = document.createElement("div"); seal.className = `judgment-seal ${j.verdict || "unresolved"}`; seal.textContent = ({correct:"正确",partially_correct:"部分正确",incorrect:"需要修正",unresolved:"证据不足"})[j.verdict] || "已判读";
      const summary = document.createElement("p"); summary.textContent = j.decision_summary || ""; renderMath(summary); $("verdict").append(seal,summary);
      if (data.probe) {
        const p = document.createElement("p"); p.textContent = data.probe.question; renderMath(p); const ta = document.createElement("textarea"); ta.rows=3; ta.placeholder="回答这条错因追问";
        const send = document.createElement("button"); send.className="btn"; send.textContent="用文字回答追问"; send.onclick=async()=>{ if(!ta.value.trim())return;send.disabled=true;if(currentProbeCard?.card_id)await apiFetch(`/api/sessions/${sessionId}/card-event`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({card_id:currentProbeCard.card_id,response_type:"bypassed_free_text"})});const res=await apiFetch(`/api/sessions/${sessionId}/probe`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({answer_text:ta.value.trim()})});const out=await res.json();renderVerdict(out);showCompletion(out); };
        const skip = document.createElement("button"); skip.className="btn ghost"; skip.textContent="跳过，不计为答错"; skip.onclick=async()=>{skip.disabled=true;const res=await apiFetch(`/api/sessions/${sessionId}/probe-skip`,{method:"POST"});const out=await res.json();renderVerdict(out);showCompletion(out)};
        $("probe").replaceChildren(p,ta,send,skip);
      } else { $("probe").replaceChildren(); }
      if (data.claim?.status) $("probe").append(document.createTextNode(`错因结论：${data.claim.status}${data.claim.resolved_error_cause ? ` · ${data.claim.resolved_error_cause}` : ""}`));
      showCompletion(data);
    }
    async function submit() {
      const answer = collectAnswer(); if (!answer) { $("answerText").focus(); return; }
      setBusy(true);
      try {
        const images=await filesToImages($("answerImages")); const draft=await canvasImage(); if(draft)images.push(draft);
        const res=await apiFetch(`/api/sessions/${sessionId}/submit`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({answer_text:answer,answer_images:images.slice(0,4)})});
        const data=await res.json(); if(!res.ok)throw new Error(data.detail||data.error||String(res.status)); renderVerdict(data);
      } catch(e){ addMessage("agent","这次提交没有完成，请检查网络后重试。","提示"); $("dialogueSheet").hidden=false; } finally {setBusy(false);}
    }

    async function openQuestion(qid) {
      const qres=await apiFetch(`/api/questions/${encodeURIComponent(qid)}`), q=await qres.json(); if(!qres.ok)throw new Error(q.error||"题目不可用");
      question=q; $("qid").textContent="本题"; $("stem").textContent=q.stem_markdown; renderMath($("stem")); $("pkgVer").textContent=q.published_packages?.[0]?.version?`内容版本 ${q.published_packages[0].version}`:""; renderAnswerControl(q);
      $("questionAssets").replaceChildren(); for(const a of q.assets||[]){const f=document.createElement("figure"),img=new Image(),cap=document.createElement("figcaption");img.src=a.image_data_url;img.alt="题目配图";cap.textContent="题目配图";f.append(img,cap);$("questionAssets").append(f);}
      const mode=assessmentGoal==="review"?"review":"diagnostic";
      const sres=await apiFetch("/api/sessions",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({student_id:principal.user_id,question_id:qid,chapter_package_version:q.published_packages?.[0]?.version,mode,draft_enabled:true,...(assessmentRunId?{assessment_run_id:assessmentRunId}:{})})});
      const s=await sres.json(); if(!sres.ok)throw new Error(s.detail||s.error); sessionId=s.session_id; $("sessionLabel").textContent="自动保存"; $("questionSheet").hidden=false;$("workspace").hidden=false;$("draftPane").hidden=false; connectEvents(); setupCanvas();
    }
    async function ask() {
      const text=$("askText").value.trim(), images=await filesToImages($("askImages")); if(!text&&!images.length)return;
      addMessage("student",text||"（上传图片）"); $("askSend").disabled=true;
      try{const res=await apiFetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({conversation_id:conversationId,text,images})});const d=await res.json();if(!res.ok)throw new Error(d.detail||d.error);conversationId=d.conversation_id;addMessage("agent",d.reply,d.evidence_policy);await renderArtifacts(d.artifacts);connectEvents();}
      catch(e){addMessage("agent","暂时没有收到回复，请稍后再试。","提示");}finally{$("askSend").disabled=false;}
    }

    document.querySelectorAll("[data-action]").forEach((b)=>b.onclick=()=>interact(b.dataset.action)); $("submitAnswer").onclick=submit; $("askSend").onclick=ask;
    $("answerImages").onchange=()=>{$("answerFileMeta").textContent=`已选择 ${Math.min(4,$("answerImages").files.length)} 张`;}; $("askImages").onchange=()=>{$("askFileMeta").textContent=`已选择 ${Math.min(4,$("askImages").files.length)} 张`;};
    const qid=params.get("q"); if(qid){try{await openQuestion(qid);}catch(e){$("freeAsk").hidden=false;addMessage("agent","这道练习暂时无法打开，你可以先在这里提问。","提示");}}else{$("freeAsk").hidden=false;}
  </script>
</body></html>
