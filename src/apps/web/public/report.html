<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告与计划 · AGMATH</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/math-render.css"></head>
<body class="proof-ui" data-page-title="报告"><header class="app-header" data-app-shell aria-label="应用顶栏"></header>
<main class="page narrow page-stack">
  <section class="page-hero compact"><p class="eyebrow">学习报告</p><h1>先看现在，再决定下一步</h1><p class="lede">这里汇总最近的学习变化、需要复习的内容和接下来的计划。想了解某个判断时，可以展开查看依据。</p></section>
  <section class="proof-sheet"><div class="sheet-heading"><div><p class="eyebrow">当前状态</p><h2>知识掌握</h2></div><span id="snapshotMeta" class="mono"></span></div><div id="dims" class="artifact-deck"><p>正在整理最近的学习状态…</p></div></section>
  <section class="proof-sheet"><div class="sheet-heading"><div><p class="eyebrow">接下来</p><h2>复习安排</h2></div></div><div id="retention" class="artifact-deck"></div></section>
  <section class="proof-sheet"><div class="sheet-heading"><div><p class="eyebrow">学习卡点</p><h2>需要继续观察的错误</h2></div></div><div id="misconceptions" class="artifact-deck"></div></section>
  <section class="proof-sheet"><div class="sheet-heading"><div><p class="eyebrow">学习计划</p><h2>未来 1–4 周</h2></div><button class="btn ghost" id="genPlan" type="button">更新计划</button></div><div id="plan"><p>完成几次学习后，可以在这里生成计划。</p></div><p id="planFeedback" class="muted" hidden></p></section>
  <details class="proof-sheet"><summary>查看学习状态的更新时间</summary><div id="history" class="page-stack"></div></details>
  <details class="proof-sheet"><summary>查看判断依据</summary><div id="evidence"><p>正在读取学习记录…</p></div></details>
</main>
<script type="module">
 import{requirePrincipal,apiFetch}from"/assets/app-shell.js";import{renderMath}from"/assets/math-render.js";const p=await requirePrincipal();const $=id=>document.getElementById(id);const requested=new URLSearchParams(location.search).get("student");const studentId=(p.roles||[]).some(r=>["teacher","tenant_admin"].includes(r))&&requested?requested:p.user_id;
 const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value??"";if(cls)e.className=cls;return e};
 const rank={weak:0,learning:1,insufficient_evidence:2,possibly_mastered:3,mastered:4};const risk=s=>({weak:"需要重点练习",learning:"正在学习",insufficient_evidence:"还需要更多练习",possibly_mastered:"基本稳定",mastered:"掌握稳定"})[s]||"继续观察";
 async function projection(){const r=await apiFetch(`/api/students/${studentId}/projection`);if(!r.ok){$("dims").innerHTML='<div class="empty-note"><strong>学习状态正在建立</strong><span>先完成学习设置和一轮练习，这里就会显示知识掌握变化。</span><a class="btn ghost" href="/profile.html?first=1">完成学习设置</a></div>';return}const d=await r.json(),s=d.snapshot;$("snapshotMeta").textContent=s?.published_at?new Date(s.published_at).toLocaleDateString():"";$("dims").replaceChildren();for(const x of [...(s?.dimensions||[])].sort((a,b)=>(rank[a.state]??9)-(rank[b.state]??9))){const c=text("article","","artifact-card"),h=text("strong",`${x.dimension_id} · ${risk(x.state)}`),v=text("p",`当前稳定度 ${Math.round(Number(x.p_profile||0)*100)}%`),m=text("small",`依据 ${x.independent_observation_count||0} 次独立练习`,"muted");c.append(h,v,m);$("dims").append(c)}if(!s?.dimensions?.length)$("dims").innerHTML='<div class="empty-note"><strong>还没有学习证据</strong><span>完成一轮短练习后，这里会显示知识掌握情况。</span><a class="btn ghost" href="/">开始学习</a></div>'}
 async function history(){const r=await apiFetch(`/api/students/${studentId}/history`),d=await r.json();if(!r.ok){$("history").textContent="暂时无法读取学习历史。";return}$("retention").replaceChildren();for(const x of d.retention||[])$("retention").append(text("article",`${x.dimension_id}\n${x.stable?`建议复习：${x.next_review_due?new Date(x.next_review_due).toLocaleDateString():"待安排"}`:"继续完成几次间隔练习后安排复习"}`,"artifact-card"));if(!d.retention?.length)$("retention").innerHTML='<div class="empty-note">目前没有到期复习内容</div>';$("misconceptions").replaceChildren();for(const x of d.misconceptions||[])$("misconceptions").append(text("article",`${x.error_cause_id}\n${({active:"仍需关注",resolved:"已经改善",observing:"继续观察"})[x.state]||x.state} · ${(x.evidence_refs||[]).length} 条学习记录`,"artifact-card"));if(!d.misconceptions?.length)$("misconceptions").innerHTML='<div class="empty-note">目前没有需要重点关注的错误模式</div>';$("history").replaceChildren();for(const s of d.snapshots||[])$("history").append(text("article",`${new Date(s.published_at||s.created_at).toLocaleString()} · ${s.snapshot_id}`,"artifact-card"));if(!d.snapshots?.length)$("history").textContent="还没有历史记录。"}
 async function evidence(){const r=await apiFetch(`/api/students/${studentId}/evidence`),d=await r.json();$("evidence").replaceChildren();for(const s of d.sessions||[]){const box=document.createElement("details");box.className="artifact-card";const sum=document.createElement("summary");sum.textContent=`题目 ${s.question_id} · ${s.state==="CLOSED"?"已完成":"进行中"}`;box.append(sum);box.append(text("p",`${s.started_at?new Date(s.started_at).toLocaleString():""} · 提示程度 ${Number(s.hint_level||0)}`,"muted"));for(const j of s.judgments||[]){box.append(text("h3",({correct:"回答正确",partially_correct:"部分正确",incorrect:"需要修正",unresolved:"继续观察"})[j.verdict]||j.verdict),text("p",j.payload?.decision_summary||"","muted"));const basis=document.createElement("details"),basisSummary=document.createElement("summary");basisSummary.textContent="查看判断依据";basis.append(basisSummary);const items=j.payload?.rubric_items||[];if(items.length){const list=document.createElement("ul");for(const item of items){const label=({met:"已做到",not_met:"待改进",unclear:"待确认"})[item.status]||"继续观察";list.append(text("li",`${item.id}：${label}`))}basis.append(list)}else{const confidence=({low:"较明确",medium:"仍需结合后续练习",high:"暂时不确定"})[j.uncertainty||j.payload?.uncertainty]||"仍需结合后续练习";basis.append(text("p",`这次判断${confidence}。`,"muted"))}box.append(basis)}renderMath(box);$("evidence").append(box)}if(!d.sessions?.length)$("evidence").textContent="还没有可查看的学习记录。"}
 async function plan(){const r=await apiFetch(`/api/students/${studentId}/plans`);if(!r.ok){$("plan").innerHTML='<div class="empty-note">完成几次学习后，可以生成你的学习计划</div>';return}const d=await r.json();$("plan").replaceChildren();if(d.explanation)$("plan").append(text("p",d.explanation));for(const t of d.tasks||[])$("plan").append(text("article",`第 ${t.week} 周 · ${t.kind}\n重点：${(t.dimension_ids||[]).join("、")}\n完成标准：${t.criterion}\n复习安排：${t.review_condition}${t.why?`\n为什么这样安排：${t.why}`:""}`,"artifact-card"))}
 $("genPlan").onclick=async()=>{const b=$("genPlan"),feedback=$("planFeedback");b.disabled=true;b.textContent="正在更新…";feedback.hidden=false;feedback.textContent="正在根据最近的学习证据安排计划…";try{const response=await apiFetch(`/api/students/${studentId}/plans`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({horizon_weeks:4})});if(!response.ok)throw new Error();await plan();feedback.textContent="计划已更新。"}catch{feedback.textContent="暂时无法更新计划，请先完成几次学习后重试。"}finally{b.disabled=false;b.textContent="更新计划"}};await Promise.all([projection(),history(),evidence(),plan()]);
</script></body></html>
