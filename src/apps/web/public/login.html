<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · AGMATH</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-story" aria-label="产品说明">
      <div>
        <p class="eyebrow">从学习过程出发</p>
        <h1>先看你怎样思考，<br>再谈掌握与否。</h1>
        <p>AGMATH 把每次作答、提示和修正整理为可追溯证据，给学生下一步，也给教师复核入口。</p>
      </div>
    </section>
    <section class="auth-side">
      <div class="auth-card">
        <a class="app-brand" href="/" aria-label="AGMATH"><span class="app-brand-mark">∴</span><span class="app-brand-word">AGMATH</span></a>
        <p class="eyebrow" style="margin-top:28px">欢迎回来</p>
        <h1 id="title">登录</h1>
        <p class="muted">继续你的学习证据，或进入教师工作台。</p>
        <form id="authForm">
          <label for="name">姓名（注册时填写）<input id="name" autocomplete="name"></label>
          <label for="email">邮箱<input id="email" type="email" autocomplete="email" required></label>
          <label for="password">密码<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
          <div class="action-cluster">
            <button class="btn cinnabar" id="submit" type="submit">登录</button>
            <button class="btn ghost" id="toggle" type="button">创建学生账号</button>
          </div>
        </form>
        <p id="message" class="error-text" role="alert"></p>
      </div>
    </section>
  </main>
  <script type="module">
    import { authClient } from "/assets/app-shell.js";
    let signup = false;
    const form = document.getElementById("authForm");
    const toggle = document.getElementById("toggle");
    const message = document.getElementById("message");
    const name = document.getElementById("name");
    toggle.onclick = () => {
      signup = !signup;
      document.getElementById("title").textContent = signup ? "创建学生账号" : "登录";
      document.getElementById("submit").textContent = signup ? "注册并登录" : "登录";
      toggle.textContent = signup ? "已有账号" : "创建学生账号";
      name.required = signup; name.closest("label").hidden = !signup;
      document.getElementById("password").autocomplete = signup ? "new-password" : "current-password";
      message.textContent = "";
    };
    name.closest("label").hidden = true;
    form.onsubmit = async (event) => {
      event.preventDefault(); message.textContent = ""; event.submitter.disabled = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const result = signup ? await authClient.signUp.email({ email, password, name: name.value.trim() }) : await authClient.signIn.email({ email, password });
      if (result.error) { message.textContent = result.error.message || "认证失败"; event.submitter.disabled = false; return; }
      const next = new URLSearchParams(location.search).get("next");
      if (next?.startsWith("/") && !next.startsWith("//")) { location.href = next; return; }
      const principal = await fetch("/api/me", { credentials: "include" }).then((r) => r.ok ? r.json() : null);
      location.href = principal?.roles?.some((role) => ["teacher", "content_reviewer", "tenant_admin"].includes(role)) ? "/teacher.html" : "/";
    };
    const existing = await authClient.getSession();
    if (existing.data?.user) {
      const principal = await fetch("/api/me", { credentials: "include" }).then((r) => r.ok ? r.json() : null);
      location.href = principal?.roles?.some((role) => ["teacher", "content_reviewer", "tenant_admin"].includes(role)) ? "/teacher.html" : "/";
    }
  </script>
</body>
</html>
