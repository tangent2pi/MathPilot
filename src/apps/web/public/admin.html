<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生与设置 · AGMATH</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css"></head>
<body>
  <header class="app-header" data-app-shell aria-label="应用顶栏"></header>
  <main class="page page-stack">
    <section class="page-hero compact" id="studentsHero"><p class="eyebrow">学生</p><h1>找到一个学生，继续下一步支持</h1><p class="lede">查看最近学习情况、掌握变化和学习计划，也可以按班级或知识点了解整体进度。</p></section>
    <section class="page-hero compact" id="settingsHero" hidden><p class="eyebrow">设置</p><h1>管理教师空间</h1><p class="lede">在这里查看账户信息、数据导出和内容版本。</p></section>

    <div id="studentsView" class="page-stack">
      <section class="section-card binding-card"><div class="section-heading"><div><p class="eyebrow">添加学生</p><h2>建立教学绑定</h2><p class="muted">输入学生注册邮箱。绑定后，你可以查看其学习报告，学生也可以使用你的教学内容。</p></div></div><form id="bindingForm" class="inline-form"><label>学生邮箱<input id="studentEmail" type="email" autocomplete="off" placeholder="student@example.com" required></label><button class="btn cinnabar" type="submit">添加学生</button></form><p id="bindingFeedback" class="status-note" hidden aria-live="polite"></p></section>
      <nav class="subnav" aria-label="学生视图"><button class="subnav-item" aria-selected="true" data-tab="students">学生</button><button class="subnav-item" aria-selected="false" data-tab="classes">班级</button><button class="subnav-item" aria-selected="false" data-tab="trends">学习趋势</button></nav>
      <section class="section-card"><div class="section-heading"><div><p class="eyebrow" id="tabLabel">学生</p><h2 id="tabTitle">学生列表</h2></div><div class="list-toolbar"><label class="search-field"><span class="sr-only">搜索学生</span><input id="search" type="search" placeholder="搜索姓名或学生 ID"></label></div></div><div id="view"><div class="empty-note">正在读取学生…</div></div></section>
    </div>

    <div id="settingsView" class="page-stack" hidden>
      <section class="section-card"><div class="section-heading"><div><p class="eyebrow">内容版本</p><h2>已发布内容</h2><p class="muted">查看当前可用的内容版本和发布时间。</p></div><a class="btn ghost" href="/content.html">打开内容</a></div><div id="packages"><div class="empty-note">正在读取内容版本…</div></div></section>
      <section class="section-card"><div class="section-heading"><div><p class="eyebrow">评估记录</p><h2>质量检查</h2><p class="muted">查看最近的自动检查和回归结果。</p></div></div><div id="evaluations"><div class="empty-note">正在读取评估记录…</div></div></section>
      <section class="section-card"><div class="section-heading"><div><p class="eyebrow">数据</p><h2>导出工作区数据</h2><p class="muted">用于备份、教研分析或迁移。</p></div><a class="btn cinnabar" href="/api/admin/export" download>导出完整数据</a></div><div class="export-grid" id="exports"></div></section>
    </div>
  </main>

  <script type="module">
    import { requirePrincipal, apiFetch, formatDate } from "/assets/app-shell.js";
    const mode = new URLSearchParams(location.search).get("view") === "settings" ? "settings" : "students";
    document.body.dataset.pageTitle = mode === "settings" ? "设置" : "学生";
    document.title = `${document.body.dataset.pageTitle} · AGMATH`;
    await requirePrincipal(["teacher"]); const $ = (id) => document.getElementById(id); let data = {}, bindings = [], activeTab = "students";
    $("studentsHero").hidden = mode !== "students"; $("studentsView").hidden = mode !== "students"; $("settingsHero").hidden = mode !== "settings"; $("settingsView").hidden = mode !== "settings";
    const titles = { students:["学生","学生列表"], classes:["班级","班级概览"], trends:["学习趋势","最近知识变化"] };
    const makeTable = (rows, columns) => { const table = document.createElement("table"); table.className = "ledger"; const head = document.createElement("thead"), hr = document.createElement("tr"); for (const [,label] of columns) { const th=document.createElement("th");th.textContent=label;hr.append(th); } head.append(hr); const body=document.createElement("tbody"); for (const row of rows) { const tr=document.createElement("tr"); for (const [key] of columns) { const td=document.createElement("td"), value=row[key];td.textContent=key.includes("at")?formatDate(value):typeof value==="object"?JSON.stringify(value):String(value??"—");if(key.endsWith("_id")||key.includes("hash"))td.className="mono";tr.append(td); } body.append(tr); } table.append(head,body); return table; };

    function showStudents(rows) {
      const host=$("view");host.replaceChildren(); const query=$("search").value.trim().toLowerCase(); rows=rows.filter((row)=>!query||`${row.display_name||""} ${row.user_id||""}`.toLowerCase().includes(query));
      if(!rows.length){host.innerHTML='<div class="empty-note"><strong>没有找到学生</strong><span>学生完成绑定后会出现在这里</span></div>';return;}
      const grid=document.createElement("div");grid.className="student-grid";for(const row of rows){const card=document.createElement("article");card.className="student-card";const name=document.createElement("h3");name.textContent=row.display_name||"学生";const meta=document.createElement("p");meta.textContent=`${row.current_score??"—"} → ${row.target_score??"—"} 分 · 已完成 ${row.completed_sessions||0} 次学习`;const time=document.createElement("small");time.textContent=row.latest_snapshot_at?`最近更新 ${formatDate(row.latest_snapshot_at)}`:"等待首次学习记录";const actions=document.createElement("div");actions.className="action-cluster";const report=document.createElement("a");report.className="btn";report.href=`/report.html?student=${encodeURIComponent(row.user_id)}`;report.textContent="查看学习报告";actions.append(report);const binding=bindings.find((item)=>item.student_id===row.user_id&&item.status==="active");if(binding){const remove=document.createElement("button");remove.className="btn ghost";remove.type="button";remove.textContent="解除绑定";remove.onclick=async()=>{if(!confirm(`解除与 ${row.display_name||"这位学生"} 的绑定？`))return;remove.disabled=true;const response=await apiFetch(`/api/teacher-student-bindings/${encodeURIComponent(binding.binding_id)}`,{method:"DELETE"});if(response.ok)await loadData();else remove.disabled=false;};actions.append(remove);}card.append(name,meta,time,actions);grid.append(card);}host.append(grid);
    }
    function show(tab) { activeTab=tab;document.querySelectorAll("[data-tab]").forEach((button)=>button.setAttribute("aria-selected",String(button.dataset.tab===tab)));const [label,title]=titles[tab];$("tabLabel").textContent=label;$("tabTitle").textContent=title;if(tab==="students")return showStudents(data.students||[]);const host=$("view");host.replaceChildren();let rows=[],cols=[];if(tab==="classes"){rows=data.classes||[];cols=[["name","班级"],["students","学生数"],["class_id","班级 ID"]];}else{rows=data.trends||[];cols=[["student_id","学生"],["dimension_id","知识点"],["observations","学习记录"],["successes","独立完成"],["last_observed_at","最近更新"]];}if(!rows.length){host.innerHTML='<div class="empty-note"><strong>这里还没有数据</strong><span>完成学习活动后会逐步积累</span></div>';return;}const wrap=document.createElement("div");wrap.className="table-wrap";wrap.append(makeTable(rows,cols));host.append(wrap);}
    function renderSettings(){const packages=data.packages||[], evaluations=data.golden_runs||[];$("packages").replaceChildren();if(!packages.length)$("packages").innerHTML='<div class="empty-note">还没有已发布内容</div>';else{const wrap=document.createElement("div");wrap.className="table-wrap";wrap.append(makeTable(packages,[["chapter_id","内容集"],["version","版本"],["published_at","发布时间"],["manifest_hash","内容标识"]]));$("packages").append(wrap);}$("evaluations").replaceChildren();if(!evaluations.length)$("evaluations").innerHTML='<div class="empty-note">还没有质量检查记录</div>';else{const wrap=document.createElement("div");wrap.className="table-wrap";wrap.append(makeTable(evaluations,[["eval_kind","检查类型"],["golden_set","数据集"],["metrics","结果"],["created_at","时间"]]));$("evaluations").append(wrap);}}
    const sets={knowledge_points:"知识点",question_types:"题型",error_causes:"错因",questions:"题目",diagnosis_rules:"诊断规则",student_cases:"学生学习记录",field_lineage:"内容来源"};for(const[id,label]of Object.entries(sets)){const a=document.createElement("a");a.className="export-card";a.href=`/api/admin/export?format=csv&dataset=${id}`;a.download=`${id}.csv`;a.innerHTML=`<strong>${label}</strong><span>CSV 下载</span>`;$("exports").append(a);}
    document.querySelectorAll("[data-tab]").forEach((button)=>button.onclick=()=>show(button.dataset.tab));$("search").oninput=()=>activeTab==="students"&&showStudents(data.students||[]);
    async function loadData(){const [overviewResponse,bindingResponse]=await Promise.all([apiFetch("/api/admin/overview"),apiFetch("/api/teacher-student-bindings")]);data=await overviewResponse.json();const bindingData=await bindingResponse.json();bindings=bindingData.bindings||[];if(!overviewResponse.ok)$(mode==="settings"?"packages":"view").textContent=data.error||"暂时无法读取数据";else if(mode==="settings")renderSettings();else show(activeTab);}
    $("bindingForm").onsubmit=async(event)=>{event.preventDefault();const button=event.submitter;button.disabled=true;const response=await apiFetch("/api/teacher-student-bindings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({student_email:$("studentEmail").value.trim()})});const result=await response.json();$("bindingFeedback").hidden=false;$("bindingFeedback").className=`status-note ${response.ok?"success":"error"}`;$("bindingFeedback").textContent=response.ok?"学生已添加到你的教学空间。":result.error==="student already has an active teacher"?"该学生已经绑定了教师。":result.error==="student not found"?"没有找到使用该邮箱注册的学生。":"暂时无法添加，请稍后重试。";button.disabled=false;if(response.ok){$("studentEmail").value="";await loadData();}};
    await loadData();
  </script>
</body>
</html>
