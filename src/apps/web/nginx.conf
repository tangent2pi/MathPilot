server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  etag on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self'; connect-src 'self'" always;

  location ~* ^/assets/fonts/.*\.(woff2?|ttf)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ~* ^/fonts/.*\.(woff2?|ttf|css)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    # React Router browser history fallback；静态资源缺失仍由 Vite 的哈希路径自然返回 404。
    try_files $uri $uri/ /index.html;
  }

  # 前端只经 api 访问后端（同源反代，避免 CORS 与端口暴露）
  location /api/ {
    # API 对原始文件执行独立的类型与大小校验。这里需容纳 20 MiB 文件经
    # Base64/JSON 编码后的请求体，也避免 1.5 MiB 头像在编码后被默认 1 MiB
    # 限制提前拒绝。
    client_max_body_size 32m;
    proxy_pass http://api:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 覆盖客户端同名头；Better Auth 只信任这条单跳代理写入的地址。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 420s;
  }
}
